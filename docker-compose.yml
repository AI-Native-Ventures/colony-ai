name: buzz

services:
  postgres:
    image: postgres:17-alpine
    container_name: buzz-postgres
    environment:
      POSTGRES_USER: buzz
      POSTGRES_PASSWORD: buzz_dev
      POSTGRES_DB: buzz
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "postgres"
      com.buzz.env: "dev"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: buzz-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.buzz.service: "redis"
      com.buzz.env: "dev"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: buzz-adminer
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - buzz-net
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    deploy:
      resources:
        limits:
          memory: 64m
    labels:
      com.buzz.service: "adminer"
      com.buzz.env: "dev"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: buzz-keycloak
    command: start-dev --http-port=8080
    environment:
      KC_DB: dev-mem
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    labels:
      com.buzz.service: "keycloak"
      com.buzz.env: "dev"
    restart: unless-stopped

  minio:
    image: codemowers/minio:RELEASE.2025-09-07T16-13-09Z@sha256:ab5a28fd48a89e04a837ea4a80085ea342902f8ffdce1a52994ad6f8b3adfc77
    container_name: buzz-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: buzz_dev
      MINIO_ROOT_PASSWORD: buzz_dev_secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - buzz-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
    labels:
      com.buzz.service: "minio"
      com.buzz.env: "dev"
    restart: unless-stopped

  minio-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.37.3@sha256:83f8ffe939569070c5b66d22231862ab78718766d9d8e4c44ca84dd0be5569a5
    container_name: buzz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - buzz-net
    environment:
      AWS_ACCESS_KEY_ID: buzz_dev
      AWS_SECRET_ACCESS_KEY: buzz_dev_secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        endpoint=http://minio:9000
        bucket_query="Buckets[?Name=='buzz-media'].Name | [0]"
        bucket_exists="$$(aws --endpoint-url "$$endpoint" s3api list-buckets --query "$$bucket_query" --output text)"
        if [ "$$bucket_exists" = "None" ]; then
          aws --endpoint-url "$$endpoint" s3api create-bucket --bucket buzz-media
        fi
        if policy_output="$$(aws --endpoint-url "$$endpoint" s3api get-bucket-policy --bucket buzz-media --query Policy --output text 2>&1)"; then
          aws --endpoint-url "$$endpoint" s3api delete-bucket-policy --bucket buzz-media
        elif [[ "$$policy_output" != *"(NoSuchBucketPolicy)"* ]]; then
          printf '%s\n' "$$policy_output" >&2
          exit 1
        fi
    labels:
      com.buzz.service: "minio-init"
      com.buzz.env: "dev"
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: buzz-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - buzz-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 128m
    labels:
      com.buzz.service: "prometheus"
      com.buzz.env: "dev"
    restart: unless-stopped

volumes:
  postgres-data:
    name: buzz-postgres-data
    labels:
      com.buzz.volume: "postgres"
  minio-data:
    name: buzz-minio-data
    labels:
      com.buzz.volume: "minio"
  prometheus-data:
    name: buzz-prometheus-data
    labels:
      com.buzz.volume: "prometheus"

networks:
  buzz-net:
    name: buzz-net
    driver: bridge
    labels:
      com.buzz.network: "dev"
