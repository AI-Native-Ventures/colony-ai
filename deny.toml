[advisories]
ignore = [
    # instant 0.1.13 — unmaintained crate. Transitive dep: nostr → instant.
    # Will be resolved when nostr crate updates its dependencies.
    { id = "RUSTSEC-2024-0384", reason = "transitive dep via nostr; no upstream fix available" },
    # paste 1.0.15 — unmaintained. Transitive dep: mesh-llm → iroh → netlink-* → paste.
    # No safe upgrade available; tracked for upstream (iroh/netlink) replacement.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep via mesh-llm → iroh → netlink; no upstream fix available" },
    # quick-xml < 0.41: quadratic runtime on duplicate-attribute check (0194) and
    # unbounded namespace-declaration allocation in NsReader (0195). Both DoS-class,
    # requiring attacker-controlled XML. Our two locked versions only parse trusted
    # input: 0.38.4 (rust-s3/aws-creds — responses from our own S3/MinIO endpoint)
    # and 0.39.4 (mesh-llm → iroh → netdev → plist — local macOS system plists).
    # Patched release (>= 0.41.0) is unreachable until rust-s3 and plist/netdev bump;
    # remove these when upstream catches up.
    { id = "RUSTSEC-2026-0194", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    { id = "RUSTSEC-2026-0195", reason = "transitive via rust-s3 and mesh-llm→plist; trusted-input XML only; no upstream fix available yet" },
    # unsafe-libyaml: unmaintained notice (no known vulnerability). Transitive via
    # serde_yaml; cargo-deny reports no safe upgrade. Remove once serde_yaml moves
    # to a maintained YAML backend or we replace serde_yaml.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained notice only, transitive via serde_yaml; no safe upgrade available" },
    # zip 2.4.2: extract() keeps SUID/SGID bits (0367), follows symlink targets
    # outside the destination (0368) and applies permissions through symlinks
    # (0369). Only reachable through mesh-llm, a buzz-relay dev-dependency for
    # tests and examples, so it never ships. The fix (zip >= 9) is unreachable
    # until mesh-llm moves off zip 2.x; remove these when it does.
    { id = "RUSTSEC-2026-0367", reason = "zip 2.x via mesh-llm dev-dependency only; not shipped; no upgrade until mesh-llm bumps zip" },
    { id = "RUSTSEC-2026-0368", reason = "zip 2.x via mesh-llm dev-dependency only; not shipped; no upgrade until mesh-llm bumps zip" },
    { id = "RUSTSEC-2026-0369", reason = "zip 2.x via mesh-llm dev-dependency only; not shipped; no upgrade until mesh-llm bumps zip" },
    # Added 25 Nov 2026 after the advisory database moved. Review all of these by
    # 2026-12-25. hickory-net, hickory-proto and hickory-resolver (a dozen DNSSEC
    # and parsing advisories), pulldown-cmark and url were fixed by bumping the
    # lockfile instead of being ignored.
    # chrono 0.4.45 and chrono-tz 0.10.4: unmaintained notices, no vulnerability.
    # Used all over (buzz-acp, buzz-workflow, kube, sqlx); no replacement is
    # available, so nothing to upgrade to.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice only; used workspace-wide, no safe upgrade available; review by 2026-12-25" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained notice only; used by buzz-acp and buzz-workflow, no safe upgrade available; review by 2026-12-25" },
    # humantime 2.3.0: unmaintained notice only. Reached through xet-runtime and
    # hf-hub in mesh-llm, a buzz-relay dev-dependency, so it never ships.
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained notice only; mesh-llm dev-dependency of buzz-relay, not shipped; review by 2026-12-25" },
    # libsqlite3-sys 0.35.0 (bundled SQLite CVE): only via mesh-llm-log-store in
    # mesh-llm, a buzz-relay dev-dependency, so it never ships. The fix needs
    # libsqlite3-sys >= 0.39, which rusqlite in mesh-llm does not allow yet.
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys via mesh-llm dev-dependency only; not shipped; fix needs mesh-llm to bump rusqlite; review by 2026-12-25" },
    # kube-client 2.0.1: openssl-tls trusts the default OpenSSL CA store. Colony
    # builds kube with default-features = false and only client + rustls-tls
    # (Cargo.toml), so the openssl-tls feature is not compiled. kube is used only
    # by buzz-backend-kubernetes. The fix is a two-major bump (>= 4.2.1).
    { id = "RUSTSEC-2026-0600", reason = "openssl-tls feature not enabled (kube uses rustls-tls); only buzz-backend-kubernetes; fix needs kube 4.x; review by 2026-12-25" },
    # rmcp 1.8.0: unbounded buffering in Streamable HTTP clients. The shipped
    # harness (sprig: buzz-agent, buzz-dev-mcp) builds rmcp with client,
    # transport-child-process, server and transport-io only, with no streamable
    # HTTP client. The fix is a two-major bump (>= 3.9.0).
    { id = "RUSTSEC-2026-0462", reason = "streamable HTTP client feature not enabled in buzz-agent or buzz-dev-mcp (child-process and stdio only); fix needs rmcp 3.x; review by 2026-12-25" },
    # zip 2.4.2: three more advisories on the same mesh-llm dev-dependency path as
    # the zip ignores above (extract and streaming reader). Not shipped; fix needs
    # zip >= 9 / 9.0.5.
    { id = "RUSTSEC-2026-0429", reason = "zip 2.x via mesh-llm dev-dependency only; not shipped; no upgrade until mesh-llm bumps zip; review by 2026-12-25" },
    { id = "RUSTSEC-2026-0545", reason = "zip 2.x via mesh-llm dev-dependency only; not shipped; no upgrade until mesh-llm bumps zip; review by 2026-12-25" },
    { id = "RUSTSEC-2026-0548", reason = "zip 2.x via mesh-llm dev-dependency only; not shipped; no upgrade until mesh-llm bumps zip; review by 2026-12-25" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MITNFA",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    # minicbor's permissive, OSI-approved license. Used for strict App Attest
    # assertion CBOR parsing and also transitively by appattest.
    "BlueOak-1.0.0",
    # bzip2/libbzip2's permissive BSD-like license. New via desktop zip/bzip2
    # transitive deps; compatible with Apache-2.0 distribution.
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

# mesh-llm workspace crates (pinned git dep) omit a per-crate `license` field in
# their manifests, so cargo-deny reports them as unlicensed. The mesh-llm repo is
# licensed "MIT OR Apache-2.0" (workspace Cargo.toml + top-level LICENSE = Apache-2.0);
# clarify each pulled-in member to that expression. Remove once mesh sets the field
# upstream (filed).
[[licenses.clarify]]
crate = "mesh-llm-config"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-gpu-bench"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-host-runtime"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-plugin"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-llm-system"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "mesh-mixture-of-agents"
expression = "MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "buzz-desktop"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
