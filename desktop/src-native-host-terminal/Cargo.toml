[workspace]

[package]
name = "colony-native-host-terminal"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false
description = "Isolated host-neutral PTY contract for Phase 1 terminal parity (no Tauri, no PTY spawn in unit scope)"

[dependencies]
buzz_terminal = { package = "buzz-terminal", path = "../src-tauri/crates/buzz-terminal" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
