[workspace]

[package]
name = "colony-native-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "Apache-2.0"
publish = false

[features]
default = []
identity-file-only = ["dep:colony_identity_store"]
identity-system-keyring = [
    "dep:colony_identity_store",
    "colony_identity_store/system-keyring",
]
identity-diagnostic = [
    "identity-system-keyring",
    "colony_identity_store/diagnostic",
]
identity-crash-test = ["identity-system-keyring"]

[dependencies]
atomic-write-file = "=0.3.0"
colony_identity_kernel = { package = "colony-identity-kernel", path = "../identity-kernel" }
colony_identity_store = { package = "colony-identity-store", path = "../identity-store", default-features = false, optional = true }
fs2 = "=0.4.3"
nostr = { version = "=0.44.7", features = ["nip44", "nip98"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "=1.24.1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["vendored"] }
