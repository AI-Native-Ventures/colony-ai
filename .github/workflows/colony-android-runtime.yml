name: Colony Android runtime proof

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
    paths:
      - ".github/workflows/colony-android-runtime.yml"
      - "scripts/android-runtime-proof.sh"
      - "scripts/android-runtime-proof-parser.py"
      - "scripts/mobile-worktree-overrides.sh"
      - "justfile"
      - "mobile/android/**"
      - "mobile/assets/**"
      - "mobile/lib/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
  pull_request:
    branches:
      - feat/phase3-auth
      - develop
    paths:
      - ".github/workflows/colony-android-runtime.yml"
      - "scripts/android-runtime-proof.sh"
      - "scripts/android-runtime-proof-parser.py"
      - "scripts/mobile-worktree-overrides.sh"
      - "justfile"
      - "mobile/android/**"
      - "mobile/assets/**"
      - "mobile/lib/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"

permissions:
  contents: read

concurrency:
  group: colony-android-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PACKAGE: ventures.ainative.colony.dogfood
  ANDROID_ACTIVITY: ventures.ainative.colony.dogfood/.MainActivity
  APK_PATH: mobile/build/app/outputs/flutter-apk/app-debug.apk
  ANDROID_RUNTIME_ARTIFACT_DIR: android-runtime-artifacts
  SOURCE_SHA: ${{ github.sha }}

jobs:
  android-runtime:
    name: Android emulator runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Activate the pinned toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Compute Hermit cache key
        id: hermit-bin-hash
        shell: bash
        run: |
          hash="$(find ./bin ! -type d | sort | xargs openssl sha256 | openssl sha256 -r | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore Hermit package cache
        id: hermit-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/hermit/pkg
          key: ${{ runner.os }}-hermit-cache-${{ steps.hermit-bin-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-hermit-cache-

      - name: Prime the pinned Flutter toolchain
        run: flutter --version

      - name: Verify Android runtime parser fixtures
        run: python3 scripts/android-runtime-proof-parser.py --self-test

      - name: Save Hermit package cache
        if: always() && steps.hermit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ~/.cache/hermit/pkg
          key: ${{ runner.os }}-hermit-cache-${{ steps.hermit-bin-hash.outputs.hash }}

      - name: Restore Flutter package cache
        id: pub-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-android-runtime-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-android-runtime-pub-

      - name: Resolve Flutter dependencies
        run: cd mobile && flutter pub get

      - name: Prepare Colony upload signing when configured
        id: android-signing
        shell: bash
        env:
          COLONY_ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.COLONY_ANDROID_UPLOAD_KEYSTORE_B64 }}
          COLONY_ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.COLONY_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          COLONY_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.COLONY_ANDROID_UPLOAD_KEY_PASSWORD }}
          COLONY_ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.COLONY_ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$COLONY_ANDROID_UPLOAD_KEYSTORE_B64" && \
                -z "$COLONY_ANDROID_UPLOAD_KEYSTORE_PASSWORD" && \
                -z "$COLONY_ANDROID_UPLOAD_KEY_PASSWORD" && \
                -z "$COLONY_ANDROID_UPLOAD_KEY_ALIAS" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$COLONY_ANDROID_UPLOAD_KEYSTORE_B64" || \
                -z "$COLONY_ANDROID_UPLOAD_KEYSTORE_PASSWORD" || \
                -z "$COLONY_ANDROID_UPLOAD_KEY_PASSWORD" || \
                -z "$COLONY_ANDROID_UPLOAD_KEY_ALIAS" ]]; then
            echo "::error::Colony Android upload signing requires all three secrets and the upload alias variable"
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/colony-android-upload.jks"
          printf '%s' "$COLONY_ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          test -s "$keystore_path"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Save Flutter package cache
        if: always() && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-android-runtime-pub-${{ hashFiles('mobile/pubspec.lock') }}

      - name: Build the Colony dogfood APK
        env:
          COLONY_GOOGLE_SERVER_CLIENT_ID: ${{ vars.COLONY_GOOGLE_WEB_CLIENT_ID }}
          BUZZ_ANDROID_DEBUG_SIGNING: ${{ steps.android-signing.outputs.enabled == 'true' && 'upload-keystore' || 'debug' }}
          BUZZ_ANDROID_UPLOAD_KEYSTORE_PATH: ${{ steps.android-signing.outputs.path }}
          BUZZ_ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.COLONY_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          BUZZ_ANDROID_UPLOAD_KEY_ALIAS: ${{ vars.COLONY_ANDROID_UPLOAD_KEY_ALIAS }}
          BUZZ_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.COLONY_ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_APK_SIGNING: ${{ steps.android-signing.outputs.enabled == 'true' && 'colony-upload-key' || 'android-debug-key' }}
        run: |
          just mobile-build-android
          test -s "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Remove temporary upload keystore
        if: always()
        env:
          KEYSTORE_PATH: ${{ steps.android-signing.outputs.path }}
        run: |
          if [[ -n "$KEYSTORE_PATH" ]]; then
            rm -f -- "$KEYSTORE_PATH"
          fi

      - name: Require the normal Linux emulator acceleration path
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Boot emulator and prove app launch/relaunch
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-runtime-proof.sh

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: colony-android-runtime-${{ github.sha }}
          if-no-files-found: warn
          path: |
            android-runtime-artifacts
            mobile/build/app/outputs/flutter-apk/app-debug.apk
