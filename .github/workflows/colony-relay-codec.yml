name: Colony RelayV2 JavaScript contract

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/src-electron/relay-protocol.mjs"
      - "desktop/src-electron/relay-protocol.test.mjs"
      - "desktop/src-electron/relay-v2-registry.generated.json"
      - "desktop/src-native-host/relay_v2_registry.json"
      - ".github/workflows/colony-relay-codec.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: RelayV2 JavaScript contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1

      - name: Activate the pinned toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Check the RelayV2 codec syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop/src-electron/relay-protocol.mjs
          node --check desktop/src-electron/relay-protocol.test.mjs

      - name: Run focused RelayV2 contract vectors
        shell: bash
        run: |
          set -euo pipefail
          node --test desktop/src-electron/relay-protocol.test.mjs
