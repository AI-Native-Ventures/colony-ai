name: Colony macOS identity custody proof

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/src-native-host/**"
      - "desktop/identity-kernel/**"
      - "desktop/identity-store/**"
      - "desktop/electron-stage0-manifest.json"
      - ".github/workflows/colony-identity-macos-production.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-production:
    name: macOS arm64 production identity custody
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Activate the pinned toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Check native-host formatting
        shell: bash
        run: cargo fmt --manifest-path desktop/src-native-host/Cargo.toml -- --check

      - name: Build the production system-keyring carrier
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --manifest-path desktop/src-native-host/Cargo.toml \
            --no-default-features --features identity-system-keyring

      - name: Prove isolated macOS keychain ownership and restart
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/colony-identity-home"
          keychain="$HOME/Library/Keychains/colony-identity-proof.keychain-db"
          binary="$PWD/desktop/src-native-host/target/release/colony-native-host"
          cleanup() {
            security default-keychain -d user -s login.keychain-db >/dev/null 2>&1 || true
            security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$proof_home"
          }
          trap cleanup EXIT
          mkdir -p "$proof_home/Library/Application Support"
          mkdir -p "$HOME/Library/Keychains"
          security create-keychain -p "" "$keychain" >/dev/null
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security login-keychain -d user -s "$keychain"
          COLONY_IDENTITY_PROOF_HOME="$proof_home" \
            COLONY_NATIVE_HOST_BIN="$binary" \
            cargo test --locked --manifest-path desktop/src-native-host/Cargo.toml \
              --no-default-features --features identity-system-keyring \
              --test identity_production_dispatch \
              macos_production_binary_initializes_and_restarts_with_same_key \
              -- --ignored --exact --nocapture

      - name: Prove concurrent production children share one identity
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/colony-identity-race-home"
          keychain="$HOME/Library/Keychains/colony-identity-race-proof.keychain-db"
          binary="$PWD/desktop/src-native-host/target/release/colony-native-host"
          cleanup() {
            security default-keychain -d user -s login.keychain-db >/dev/null 2>&1 || true
            security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$proof_home"
          }
          trap cleanup EXIT
          mkdir -p "$proof_home/Library/Application Support"
          mkdir -p "$HOME/Library/Keychains"
          security create-keychain -p "" "$keychain" >/dev/null
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security login-keychain -d user -s "$keychain"
          COLONY_IDENTITY_PROOF_HOME="$proof_home" \
            COLONY_NATIVE_HOST_BIN="$binary" \
            cargo test --locked --manifest-path desktop/src-native-host/Cargo.toml \
              --no-default-features --features identity-system-keyring \
              --test identity_production_dispatch \
              macos_production_binary_serializes_two_fresh_children \
              -- --ignored --exact --nocapture

      - name: Prove an interrupted reservation blocks before B1
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/colony-identity-reserved-home"
          keychain="$HOME/Library/Keychains/colony-identity-reserved-proof.keychain-db"
          binary="$PWD/desktop/src-native-host/target/release/colony-native-host"
          cleanup() {
            security default-keychain -d user -s login.keychain-db >/dev/null 2>&1 || true
            security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$proof_home"
          }
          trap cleanup EXIT
          mkdir -p "$proof_home/Library/Application Support"
          mkdir -p "$HOME/Library/Keychains"
          security create-keychain -p "" "$keychain" >/dev/null
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security login-keychain -d user -s "$keychain"
          COLONY_IDENTITY_PROOF_HOME="$proof_home" \
            COLONY_NATIVE_HOST_BIN="$binary" \
            cargo test --locked --manifest-path desktop/src-native-host/Cargo.toml \
              --no-default-features --features identity-system-keyring \
              --test identity_production_dispatch \
              macos_production_reserved_sidecar_blocks_before_b1 \
              -- --ignored --exact --nocapture
