name: ffmpeg bundle

# The app ships its own LGPL-only ffmpeg (desktop/ffmpeg-bundle). This builds it
# from the pinned source on the macOS and Windows runners and runs the host's
# media transcode tests against that exact binary: the voice-note envelope, the
# video transcode and the HEIC conversion must all come out as something the
# relay's validator accepts. It runs when the bundle, the transcode code or its
# fixtures change, and on request.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - desktop/ffmpeg-bundle/**
      - desktop/scripts/electron-package.mjs
      - desktop/scripts/electron-package-config.mjs
      - desktop/src-tauri/src/commands/media.rs
      - desktop/src-tauri/src/commands/media_transcode.rs
      - desktop/src-tauri/src/commands/media_voice_note.rs
      - desktop/src-tauri/tests/fixtures/media/**
      - desktop/src-tauri/assets/voice-note-video-frame.mp4
      - .github/actions/build-ffmpeg-bundle/**
      - .github/workflows/ffmpeg-bundle.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 4
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  bundled-ffmpeg:
    name: Bundled ffmpeg (${{ matrix.platform-key }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform-key: darwin-arm64
          - runner: windows-latest
            platform-key: win32-x64

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Activate Hermit toolchain (macOS)
        if: runner.os != 'Windows'
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Set up Node (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Build bundled ffmpeg
        id: ffmpeg
        uses: ./.github/actions/build-ffmpeg-bundle
        with:
          platform-key: ${{ matrix.platform-key }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: desktop/src-tauri
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Prepare Tauri external binary placeholders
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { closeSync, existsSync, openSync, readFileSync, mkdirSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import path from "node:path";

          const manifestDir = path.join("desktop", "src-tauri");
          const platform = {
            darwin: "macos",
            win32: "windows",
          }[process.platform];
          if (!platform) throw new Error(`Unsupported runner platform: ${process.platform}`);

          const config = JSON.parse(
            readFileSync(path.join(manifestDir, "tauri.conf.json"), "utf8"),
          );
          const platformConfigPath = path.join(
            manifestDir,
            `tauri.${platform}.conf.json`,
          );
          if (existsSync(platformConfigPath)) {
            const platformConfig = JSON.parse(readFileSync(platformConfigPath, "utf8"));
            if (platformConfig.bundle?.externalBin) {
              config.bundle.externalBin = platformConfig.bundle.externalBin;
            }
          }

          const hostTriple = execFileSync("rustc", ["-vV"], { encoding: "utf8" })
            .match(/^host: (.+)$/m)?.[1];
          if (!hostTriple) throw new Error("Could not determine the Rust host triple.");
          const extension = platform === "windows" ? ".exe" : "";
          for (const binary of config.bundle.externalBin ?? []) {
            const placeholder = path.join(
              manifestDir,
              `${binary}-${hostTriple}${extension}`,
            );
            mkdirSync(path.dirname(placeholder), { recursive: true });
            closeSync(openSync(placeholder, "a"));
          }
          NODE

      # COLONY_FFMPEG_PATH is read only by the test build, so the tests exercise
      # exactly the binary the installer will carry, not whatever the runner has.
      - name: Run the media transcode tests with the bundled ffmpeg
        shell: bash
        env:
          FFMPEG_BUNDLE_DIR: ${{ steps.ffmpeg.outputs.directory }}
        run: |
          set -euo pipefail
          exe="$FFMPEG_BUNDLE_DIR/ffmpeg"
          if [ "${{ runner.os }}" = "Windows" ]; then exe="$FFMPEG_BUNDLE_DIR/ffmpeg.exe"; fi
          export COLONY_FFMPEG_PATH="$exe"
          cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml \
            --lib commands::media_transcode -- --nocapture 2>&1 | tee "$RUNNER_TEMP/transcode-tests.log"
          # A test that skips because ffmpeg cannot do the job proves nothing.
          if grep -q "skipping" "$RUNNER_TEMP/transcode-tests.log"; then
            echo "A transcode test skipped against the bundled ffmpeg:" >&2
            grep "skipping" "$RUNNER_TEMP/transcode-tests.log" >&2
            exit 1
          fi
