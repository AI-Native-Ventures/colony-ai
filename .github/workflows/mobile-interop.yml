name: Mobile live-relay interop harness

# First mobile-owned interop slice: the real Flutter RelaySession against a
# disposable relay, with a second live session as the oracle peer. No
# Electron peer yet (blocked on PR19/PR20 socket activation), no devices,
# no pairing, no production relay.
on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/mobile-interop.yml"
      - "mobile/test/shared/relay/relay_live_interop_test.dart"
      - "mobile/lib/shared/relay/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-interop:
    name: Live relay session matrix (oracle peer)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Activate the pinned toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Start the disposable relay
        # Reuses the existing fixture script unmodified; the relay and its
        # Postgres/Redis backends are disposable and runner-local.
        run: ./scripts/start-relay-for-tests.sh

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run the live interop harness
        working-directory: mobile
        # Harness prints pubkeys, event/channel IDs, and correlation IDs
        # only — never nsec material, auth headers, or storage contents.
        # INTEROP_REQUIRE_RELAY=true makes a missing relay fail the run:
        # a green hosted proof always executed every test.
        run: >
          flutter test test/shared/relay/relay_live_interop_test.dart
          --dart-define=BUZZ_PUSH_GATEWAY_URL=https://push.example
          --dart-define=INTEROP_REQUIRE_RELAY=true
          --reporter expanded 2>&1 | tee "${RUNNER_TEMP}/mobile-interop-harness.log"
        env:
          INTEROP_RELAY_HTTP: http://localhost:3000

      - name: Upload harness log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mobile-interop-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/mobile-interop-harness.log
