name: Electron Stage 0 packaged feasibility

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/electron-stage0-manifest.json"
      - "desktop/package.json"
      - "desktop/src-electron/**"
      - "desktop/src-native-host/**"
      - "desktop/scripts/check-electron-stage0.mjs"
      - "desktop/scripts/package-electron-stage0.mjs"
      - "desktop/scripts/stage-electron-stage0.mjs"
      - "desktop/playwright.electron.config.ts"
      - "desktop/tests/electron-stage0-package.ts"
      - "desktop/tests/electron-host-feasibility.spec.ts"
      - "desktop/tests/electron-host-feasibility-normal.spec.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/electron-host-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-feasibility:
    name: packaged Electron / macOS arm64
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4

      - name: Assert native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          echo "runner_architecture=$machine"
          case "$machine" in
            arm64|aarch64) ;;
            *)
              echo "This lane requires a native macOS arm64 runner; got $machine" >&2
              exit 1
              ;;
          esac

      - name: Activate the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          rustc -vV
          node --version
          pnpm --version

      - name: Install only the desktop dependency graph
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          pnpm install --frozen-lockfile --filter buzz

      - name: Download the pinned Electron runtime
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          pnpm --dir desktop exec install-electron

      - name: Build the standalone arm64 helper
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          cargo build --locked --manifest-path desktop/src-native-host/Cargo.toml \
            --release --target aarch64-apple-darwin

      - name: Stage and package the isolated candidate
        shell: bash
        env:
          COLONY_NATIVE_HOST_BIN: ${{ github.workspace }}/desktop/src-native-host/target/aarch64-apple-darwin/release/colony-native-host
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          rm -rf desktop/dist-electron-normal desktop/dist-electron-instrumented
          pnpm --dir desktop electron:stage0:package
          pnpm --dir desktop electron:stage0:package:instrumented

      - name: Inspect the package boundary
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          node desktop/scripts/check-electron-stage0.mjs \
            desktop/dist-electron-normal --flavor=normal
          node desktop/scripts/check-electron-stage0.mjs \
            desktop/dist-electron-instrumented --flavor=instrumented
          for app_binary in \
            "$(find desktop/dist-electron-normal -path '*/Contents/MacOS/Buzz Stage0 Normal' -type f -print -quit)" \
            "$(find desktop/dist-electron-instrumented -path '*/Contents/MacOS/Buzz Stage0 Instrumented' -type f -print -quit)"; do
            test -n "$app_binary"
            binary_description="$(file "$app_binary")"
            echo "$binary_description"
            echo "$binary_description" | grep -Eq 'arm64|aarch64'
          done

      - name: Run the normal relocated Electron proof with hostile ambient values
        shell: bash
        env:
          COLONY_STAGE0_PLAYWRIGHT_OUTPUT: normal-test-results
          COLONY_STAGE0_PLAYWRIGHT_REPORT: normal-playwright-electron-report
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          pnpm --dir desktop exec playwright test \
            --config playwright.electron.config.ts \
            tests/electron-host-feasibility-normal.spec.ts

      - name: Record candidate and derivative build flavors
        shell: bash
        run: |
          set -euo pipefail
          for flavor in normal instrumented; do
            package_dir="desktop/.stage0-package-$flavor"
            app_dir="desktop/dist-electron-$flavor/Buzz Stage0 $(test "$flavor" = normal && echo Normal || echo Instrumented)-darwin-arm64/Buzz Stage0 $(test "$flavor" = normal && echo Normal || echo Instrumented).app"
            archive="$app_dir/Contents/Resources/app.asar"
            helper="$app_dir/Contents/Resources/colony-native-host"
            node -e 'const fs=require("node:fs");const p=process.argv[1];const j=JSON.parse(fs.readFileSync(p+"/package.json"));console.log(JSON.stringify({flavor:j.stage0Flavor,applicationId:j.stage0ApplicationId,userDataSuffix:j.stage0UserDataSuffix,sourceRevision:j.stage0SourceRevision,instrumentation:j.stage0Instrumentation}))' "$package_dir"
            shasum -a 256 "$archive" "$helper"
          done

      - name: Run the packaged Electron proof
        shell: bash
        env:
          COLONY_STAGE0_PLAYWRIGHT_OUTPUT: instrumented-test-results
          COLONY_STAGE0_PLAYWRIGHT_REPORT: instrumented-playwright-electron-report
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          pnpm --dir desktop exec playwright test \
            --config playwright.electron.config.ts \
            tests/electron-host-feasibility.spec.ts

      - name: Prove the packaged reload test detects a disabled fence
        shell: bash
        run: |
          set +e
          . ./bin/activate-hermit
          COLONY_STAGE0_TEST_MUTATION=disable-rebind-fence \
            pnpm --dir desktop exec playwright test \
              --config playwright.electron.config.ts \
              tests/electron-host-feasibility.spec.ts \
              --grep "reload rebinds the same helper"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "reload fence mutation unexpectedly passed"
            exit 1
          fi
          echo "reload fence mutation=expected-failure status=$status"

      - name: Prove the packaged IPC test detects an untrusted sender bypass
        shell: bash
        run: |
          set +e
          . ./bin/activate-hermit
          COLONY_STAGE0_TEST_MUTATION=allow-untrusted-ipc \
            pnpm --dir desktop exec playwright test \
              --config playwright.electron.config.ts \
              tests/electron-host-feasibility.spec.ts \
              --grep "packaged IPC, navigation, window, and permission guards deny"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "untrusted IPC mutation unexpectedly passed"
            exit 1
          fi
          echo "untrusted IPC mutation=expected-failure status=$status"

      - name: Upload unsigned normal candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-stage0-macos-arm64-normal-${{ github.sha }}
          path: |
            desktop/dist-electron-normal
            desktop/normal-playwright-electron-report
            desktop/normal-test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unsigned instrumented derivative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-stage0-macos-arm64-instrumented-${{ github.sha }}
          path: |
            desktop/dist-electron-instrumented
            desktop/instrumented-playwright-electron-report
            desktop/instrumented-test-results
          if-no-files-found: ignore
          retention-days: 7

  packaged-feasibility-windows:
    name: packaged Electron / Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4

      - name: Assert native Windows x64 runner
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          Write-Host "runner_architecture=$architecture"
          if ($architecture -ne "X64") {
            throw "This lane requires a native Windows x64 runner; got $architecture"
          }

      - name: Add the pinned Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-pc-windows-msvc
          rustc -vV

      - name: Install the pinned Node and pnpm toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Assert x64 Node runtime
        shell: pwsh
        run: |
          if ((node -p "process.arch") -ne "x64") {
            throw "This lane requires a x64 Node runtime"
          }

      - name: Install only the desktop dependency graph
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --filter buzz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download the pinned Electron runtime
        shell: pwsh
        run: |
          pnpm --dir desktop exec install-electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the standalone x64 Windows helper
        shell: pwsh
        run: |
          cargo build --locked --manifest-path desktop/src-native-host/Cargo.toml `
            --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage and package both immutable flavors
        shell: pwsh
        env:
          COLONY_NATIVE_HOST_BIN: ${{ github.workspace }}/desktop/src-native-host/target/x86_64-pc-windows-msvc/release/colony-native-host.exe
        run: |
          pnpm --dir desktop electron:stage0:package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir desktop electron:stage0:package:windows:instrumented
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect the real Windows ASAR and PE boundary
        shell: pwsh
        run: |
          node desktop/scripts/check-electron-stage0.mjs `
            desktop/dist-electron-normal --platform=win32 --arch=x64 `
            --target=x86_64-pc-windows-msvc --flavor=normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop/scripts/check-electron-stage0.mjs `
            desktop/dist-electron-instrumented --platform=win32 --arch=x64 `
            --target=x86_64-pc-windows-msvc --flavor=instrumented
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive, hash, and relocate the unsigned candidates
        shell: pwsh
        run: |
          $archiveRoot = Join-Path $env:RUNNER_TEMP "electron-stage0-windows-x64"
          Remove-Item -Recurse -Force $archiveRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $archiveRoot | Out-Null
          $normalZip = Join-Path $archiveRoot "electron-stage0-windows-x64-normal.zip"
          $instrumentedZip = Join-Path $archiveRoot "electron-stage0-windows-x64-instrumented.zip"
          Compress-Archive -Path "desktop/dist-electron-normal/*" -DestinationPath $normalZip -Force
          Compress-Archive -Path "desktop/dist-electron-instrumented/*" -DestinationPath $instrumentedZip -Force
          $relocatedRoot = Join-Path $archiveRoot "relocated"
          $normalRoot = Join-Path $relocatedRoot "normal"
          $instrumentedRoot = Join-Path $relocatedRoot "instrumented"
          New-Item -ItemType Directory -Force $normalRoot, $instrumentedRoot | Out-Null
          Expand-Archive -Path $normalZip -DestinationPath $normalRoot -Force
          Expand-Archive -Path $instrumentedZip -DestinationPath $instrumentedRoot -Force
          Add-Content -Path $env:GITHUB_ENV -Value "COLONY_STAGE0_NORMAL_ROOT=$normalRoot"
          Add-Content -Path $env:GITHUB_ENV -Value "COLONY_STAGE0_INSTRUMENTED_ROOT=$instrumentedRoot"
          foreach ($flavor in @("normal", "instrumented")) {
            $package = Join-Path $env:GITHUB_WORKSPACE "desktop/.stage0-package-$flavor/package.json"
            node -e 'const fs=require("node:fs");const j=JSON.parse(fs.readFileSync(process.argv[1]));console.log(JSON.stringify({flavor:j.stage0Flavor,platform:j.stage0Platform,arch:j.stage0Arch,targetTriple:j.stage0TargetTriple,helperName:j.stage0HelperName,applicationId:j.stage0ApplicationId,userDataSuffix:j.stage0UserDataSuffix,sourceRevision:j.stage0SourceRevision,instrumentation:j.stage0Instrumentation}))' $package
          }
          Get-FileHash -Algorithm SHA256 $normalZip
          Get-FileHash -Algorithm SHA256 $instrumentedZip

      - name: Run the relocated normal Windows Electron proof
        shell: pwsh
        env:
          COLONY_STAGE0_PLAYWRIGHT_OUTPUT: windows-normal-test-results
          COLONY_STAGE0_PLAYWRIGHT_REPORT: windows-normal-playwright-electron-report
        run: |
          pnpm --dir desktop exec playwright test `
            --config playwright.electron.config.ts `
            tests/electron-host-feasibility-normal.spec.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the relocated instrumented Windows Electron proof
        shell: pwsh
        env:
          COLONY_STAGE0_PLAYWRIGHT_OUTPUT: windows-instrumented-test-results
          COLONY_STAGE0_PLAYWRIGHT_REPORT: windows-instrumented-playwright-electron-report
        run: |
          pnpm --dir desktop exec playwright test `
            --config playwright.electron.config.ts `
            tests/electron-host-feasibility.spec.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove the Windows packaged reload guard is falsifiable
        shell: pwsh
        run: |
          $env:COLONY_STAGE0_TEST_MUTATION = "disable-rebind-fence"
          pnpm --dir desktop exec playwright test `
            --config playwright.electron.config.ts `
            tests/electron-host-feasibility.spec.ts `
            --grep "reload rebinds the same helper"
          $status = $LASTEXITCODE
          Remove-Item Env:COLONY_STAGE0_TEST_MUTATION -ErrorAction SilentlyContinue
          if ($status -eq 0) { throw "reload fence mutation unexpectedly passed" }
          Write-Host "reload fence mutation=expected-failure status=$status"

      - name: Prove the Windows packaged sender guard is falsifiable
        shell: pwsh
        run: |
          $env:COLONY_STAGE0_TEST_MUTATION = "allow-untrusted-ipc"
          pnpm --dir desktop exec playwright test `
            --config playwright.electron.config.ts `
            tests/electron-host-feasibility.spec.ts `
            --grep "packaged IPC, navigation, window, and permission guards deny"
          $status = $LASTEXITCODE
          Remove-Item Env:COLONY_STAGE0_TEST_MUTATION -ErrorAction SilentlyContinue
          if ($status -eq 0) { throw "untrusted IPC mutation unexpectedly passed" }
          Write-Host "untrusted IPC mutation=expected-failure status=$status"

      - name: Upload unsigned Windows normal candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-stage0-windows-x64-normal-${{ github.sha }}
          path: |
            ${{ runner.temp }}/electron-stage0-windows-x64/electron-stage0-windows-x64-normal.zip
            desktop/windows-normal-playwright-electron-report
            desktop/windows-normal-test-results
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned Windows instrumented derivative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-stage0-windows-x64-instrumented-${{ github.sha }}
          path: |
            ${{ runner.temp }}/electron-stage0-windows-x64/electron-stage0-windows-x64-instrumented.zip
            desktop/windows-instrumented-playwright-electron-report
            desktop/windows-instrumented-test-results
          if-no-files-found: error
          retention-days: 7
