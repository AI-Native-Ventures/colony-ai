name: Electron package

on:
  workflow_call:
    inputs:
      release:
        description: Build public Colony installers and update metadata.
        required: false
        type: boolean
        default: false
    secrets:
      COLONY_LOGO_DEV_TOKEN:
        required: false
      COLONY_GOOGLE_DESKTOP_CLIENT_SECRET:
        required: false
      APPLE_DEVELOPER_ID_CERT_P12_B64:
        required: false
      APPLE_DEVELOPER_ID_CERT_PASSWORD:
        required: false
      APPLE_NOTARY_API_KEY_P8_B64:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
      WINDOWS_SIGNING_CERT_PFX_B64:
        required: false
      WINDOWS_SIGNING_CERT_PASSWORD:
        required: false
    outputs:
      mac_signed:
        description: Whether the macOS release was signed and notarized.
        value: ${{ jobs.resolve-signing.outputs.mac_signed }}
      windows_signed:
        description: Whether the Windows release was signed.
        value: ${{ jobs.resolve-signing.outputs.windows_signed }}
  # Release pull requests into main prove the Mac and Windows app still builds.
  # Pull requests into develop skip it: the ordinary gate (ci.yml) covers them.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Build release installers and update metadata as a rehearsal. Builds artifacts only; nothing is published.
        required: false
        type: boolean
        default: false

concurrency:
  # A newer push to the same pull request supersedes this run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 4
  # A release build bakes in the production relay and builds the installers. A
  # release candidate pull request (release/<version>-candidate, from this
  # repository, into main) builds exactly the same way, so the tag release can
  # publish the candidate's installers instead of building them a second time
  # (see release-desktop.yml and desktop/scripts/select-release-candidate.mjs).
  COLONY_RELEASE_BUILD: ${{ inputs.release == true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') && endsWith(github.head_ref, '-candidate')) }}

jobs:
  resolve-signing:
    name: Resolve optional release signing
    runs-on: ubuntu-22.04
    outputs:
      mac_signed: ${{ steps.resolve.outputs.mac_signed }}
      windows_signed: ${{ steps.resolve.outputs.windows_signed }}
    steps:
      - name: Check complete optional secret groups
        id: resolve
        shell: bash
        env:
          RELEASE_BUILD: ${{ env.COLONY_RELEASE_BUILD }}
          APPLE_DEVELOPER_ID_CERT_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_B64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_B64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          WINDOWS_SIGNING_CERT_PFX_B64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_B64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          mac_any=0
          mac_all=1
          for value in \
            "$APPLE_DEVELOPER_ID_CERT_P12_B64" \
            "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            "$APPLE_NOTARY_API_KEY_P8_B64" \
            "$APPLE_NOTARY_KEY_ID" \
            "$APPLE_NOTARY_ISSUER_ID"; do
            if [ -n "$value" ]; then mac_any=1; else mac_all=0; fi
          done
          windows_any=0
          windows_all=1
          for value in "$WINDOWS_SIGNING_CERT_PFX_B64" "$WINDOWS_SIGNING_CERT_PASSWORD"; do
            if [ -n "$value" ]; then windows_any=1; else windows_all=0; fi
          done
          if [ "$RELEASE_BUILD" = "true" ] && [ "$mac_any" = "1" ] && [ "$mac_all" != "1" ]; then
            echo "Apple signing requires the complete five-secret group." >&2
            exit 1
          fi
          if [ "$RELEASE_BUILD" = "true" ] && [ "$windows_any" = "1" ] && [ "$windows_all" != "1" ]; then
            echo "Windows signing requires the complete two-secret group." >&2
            exit 1
          fi
          if [ "$RELEASE_BUILD" = "true" ] && [ "$mac_all" = "1" ]; then
            echo "mac_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mac_signed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$RELEASE_BUILD" = "true" ] && [ "$windows_all" = "1" ]; then
            echo "windows_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_signed=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package Electron (${{ matrix.platform }}-${{ matrix.arch }})
    needs: resolve-signing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-latest
            platform: win32
            arch: x64

    steps:
      # A candidate pull request builds its own head commit, not the merge with
      # main, so the installers match the head tree the release compares.
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.COLONY_RELEASE_BUILD == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - name: Record the source tree
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Package ${{ matrix.platform }}-${{ matrix.arch }}: release build ${COLONY_RELEASE_BUILD}"
            echo "commit $(git rev-parse HEAD) tree $(git rev-parse 'HEAD^{tree}')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Activate Hermit toolchain (macOS)
        if: runner.os != 'Windows'
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Set up Node and pnpm (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Set up pnpm (Windows)
        if: runner.os == 'Windows'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" != "Windows" ]; then
            . ./bin/activate-hermit
          fi
          rustc -vV
          cargo --version
          node --version
          pnpm --version

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --filter buzz

      - name: Run packaging config and path tests
        shell: bash
        run: >-
          node --test
          desktop/electron/runtime-paths.test.mjs
          desktop/scripts/electron-package-config.test.mjs

      - name: Build frontend
        shell: bash
        env:
          COLONY_LOGO_DEV_TOKEN: ${{ secrets.COLONY_LOGO_DEV_TOKEN }}
          COLONY_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.COLONY_GOOGLE_DESKTOP_CLIENT_ID }}
        run: pnpm --dir desktop build

      - name: Prepare Tauri external binary placeholders
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { closeSync, existsSync, openSync, readFileSync, mkdirSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import path from "node:path";

          const manifestDir = path.join("desktop", "src-tauri");
          const platform = {
            darwin: "macos",
            win32: "windows",
          }[process.platform];
          if (!platform) throw new Error(`Unsupported runner platform: ${process.platform}`);

          const config = JSON.parse(
            readFileSync(path.join(manifestDir, "tauri.conf.json"), "utf8"),
          );
          const platformConfigPath = path.join(
            manifestDir,
            `tauri.${platform}.conf.json`,
          );
          if (existsSync(platformConfigPath)) {
            const platformConfig = JSON.parse(readFileSync(platformConfigPath, "utf8"));
            if (platformConfig.bundle?.externalBin) {
              config.bundle.externalBin = platformConfig.bundle.externalBin;
            }
          }

          const hostTriple = execFileSync("rustc", ["-vV"], { encoding: "utf8" })
            .match(/^host: (.+)$/m)?.[1];
          if (!hostTriple) throw new Error("Could not determine the Rust host triple.");
          const extension = platform === "windows" ? ".exe" : "";
          for (const binary of config.bundle.externalBin ?? []) {
            const placeholder = path.join(
              manifestDir,
              `${binary}-${hostTriple}${extension}`,
            );
            mkdirSync(path.dirname(placeholder), { recursive: true });
            closeSync(openSync(placeholder, "a"));
          }
          NODE

      - name: Build native host
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          COLONY_LOGO_DEV_TOKEN: ${{ secrets.COLONY_LOGO_DEV_TOKEN }}
          COLONY_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.COLONY_GOOGLE_DESKTOP_CLIENT_ID }}
          COLONY_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.COLONY_GOOGLE_DESKTOP_CLIENT_SECRET }}
          RELEASE_BUILD: ${{ env.COLONY_RELEASE_BUILD == 'true' && 'true' || 'false' }}
          COLONY_PACKAGE_PLATFORM: ${{ matrix.platform }}
          MAC_SIGNED: ${{ needs.resolve-signing.outputs.mac_signed }}
        run: |
          set -euo pipefail
          # An unsigned (ad-hoc) Mac app cannot read the Keychain item the
          # previous release created, because the Keychain trusts the code
          # hash and every release has a new one. That signed the owner out on
          # every update. Unsigned Mac builds therefore leave out the system
          # keyring and keep secrets in owner-only files; a signed build keeps
          # the Keychain. The marker check below proves which one was built.
          keyring_flags=""
          if [ "$COLONY_PACKAGE_PLATFORM" = "darwin" ] && [ "$MAC_SIGNED" != "true" ]; then
            keyring_flags=""  # RED PROOF: unsigned Mac host keeps the keyring
          fi
          # Without a build-time relay the host defaults to ws://localhost:3000, so a
          # release installer would try to sign in against the user's own machine.
          # Release builds bake in the production relay; other builds are unchanged.
          if [ "$RELEASE_BUILD" = "true" ]; then
            export BUZZ_RELAY_URL="wss://relay.colony.ainative.ventures"
            # The public app may offer the bundled Colony Agent through the relay
            # gateway. It still falls back to Start free against a relay where
            # the gateway is off, and no key is ever baked into the host.
            export COLONY_CREDITS_GATEWAY=1
          fi
          # shellcheck disable=SC2086 # one flag or none, deliberately unquoted
          cargo build --locked --release \
            $keyring_flags \
            --features electron-host \
            --bin colony-native-host \
            --manifest-path desktop/src-tauri/Cargo.toml

      - name: Verify where the native host keeps its secrets
        shell: bash
        env:
          COLONY_PACKAGE_PLATFORM: ${{ matrix.platform }}
          MAC_SIGNED: ${{ needs.resolve-signing.outputs.mac_signed }}
        run: |
          set -euo pipefail
          target_dir="$(node -p 'JSON.parse(require("node:child_process").execFileSync("cargo", ["metadata", "--manifest-path", "desktop/src-tauri/Cargo.toml", "--format-version", "1", "--no-deps"], { encoding: "utf8" })).target_directory')"
          host="$target_dir/release/colony-native-host"
          if [ ! -f "$host" ]; then host="$host.exe"; fi
          expected="colony-secret-storage=keychain"
          if [ "$COLONY_PACKAGE_PLATFORM" = "darwin" ] && [ "$MAC_SIGNED" != "true" ]; then
            expected="colony-secret-storage=file"
          fi
          # LC_ALL=C: BSD grep on macOS rejects binary data under a UTF-8 locale.
          if ! LC_ALL=C grep -a -F -q "$expected" "$host"; then
            echo "The native host does not carry $expected." >&2
            exit 1
          fi
          for other in colony-secret-storage=keychain colony-secret-storage=file; do
            if [ "$other" != "$expected" ] && LC_ALL=C grep -a -F -q "$other" "$host"; then
              echo "The native host unexpectedly carries $other." >&2
              exit 1
            fi
          done
          echo "Native host secret storage: $expected."

      - name: Verify the production relay is baked into the release host
        if: env.COLONY_RELEASE_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$(node -p 'JSON.parse(require("node:child_process").execFileSync("cargo", ["metadata", "--manifest-path", "desktop/src-tauri/Cargo.toml", "--format-version", "1", "--no-deps"], { encoding: "utf8" })).target_directory')"
          host="$target_dir/release/colony-native-host"
          if [ ! -f "$host" ]; then host="$host.exe"; fi
          # LC_ALL=C: BSD grep on macOS rejects binary data under a UTF-8 locale.
          if ! LC_ALL=C grep -a -F -q "wss://relay.colony.ainative.ventures" "$host"; then
            echo "The release native host does not contain the production relay URL." >&2
            exit 1
          fi
          echo "Production relay is present in the release native host."

      - name: Verify the Colony Agent gateway flag is baked into the release host
        if: env.COLONY_RELEASE_BUILD == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$(node -p 'JSON.parse(require("node:child_process").execFileSync("cargo", ["metadata", "--manifest-path", "desktop/src-tauri/Cargo.toml", "--format-version", "1", "--no-deps"], { encoding: "utf8" })).target_directory')"
          host="$target_dir/release/colony-native-host"
          if [ ! -f "$host" ]; then host="$host.exe"; fi
          # The host carries one fixed marker: build=on only when the flag was set.
          if ! LC_ALL=C grep -a -F -q "colony-credits-gateway-build=on" "$host"; then
            echo "The release native host was built without COLONY_CREDITS_GATEWAY=1." >&2
            exit 1
          fi
          echo "Colony Agent gateway flag is present in the release native host."

      - name: Build bundled sidecars
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          COLONY_PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [ "$COLONY_PACKAGE_PLATFORM" = "win32" ]; then
            cargo build --locked --release \
              -p buzz-acp \
              -p buzz-agent \
              -p buzz-dev-mcp \
              -p git-credential-nostr \
              -p buzz-cli \
              --manifest-path Cargo.toml
          else
            cargo build --locked --release \
              -p buzz-acp \
              -p buzz-agent \
              -p buzz-backend-kubernetes \
              -p buzz-dev-mcp \
              -p git-credential-nostr \
              -p buzz-cli \
              --manifest-path Cargo.toml
          fi

      - name: Copy release binaries to private staging
        shell: bash
        env:
          COLONY_PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, chmodSync, copyFileSync, mkdirSync, statSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import os from "node:os";
          import path from "node:path";

          const platform = process.env.COLONY_PACKAGE_PLATFORM;
          const suffix = platform === "win32" ? ".exe" : "";
          const names = [
            "colony-native-host",
            "buzz-acp",
            "buzz-agent",
            "buzz-dev-mcp",
            "git-credential-nostr",
            "buzz",
          ];
          if (platform !== "win32") names.push("buzz-backend-kubernetes");
          const targetDirectory = (manifestPath) => JSON.parse(execFileSync(
            "cargo",
            ["metadata", "--manifest-path", manifestPath, "--format-version", "1", "--no-deps"],
            { encoding: "utf8" },
          )).target_directory;
          const hostReleaseDir = path.join(
            targetDirectory("desktop/src-tauri/Cargo.toml"),
            "release",
          );
          const sidecarReleaseDir = path.join(
            targetDirectory("Cargo.toml"),
            "release",
          );
          const runtimeDir = path.join(process.env.RUNNER_TEMP, "colony-electron-runtime");
          mkdirSync(runtimeDir, { recursive: true });
          for (const name of names) {
            const filename = `${name}${suffix}`;
            const releaseDir = name === "colony-native-host" ? hostReleaseDir : sidecarReleaseDir;
            const source = path.join(releaseDir, filename);
            const sourceStat = statSync(source);
            if (!sourceStat.isFile() || sourceStat.size === 0) {
              throw new Error(`Missing real release binary: ${source}`);
            }
            if (platform !== "win32" && !(sourceStat.mode & 0o111)) {
              throw new Error(`Release binary is not executable: ${source}`);
            }
            const destination = path.join(runtimeDir, filename);
            copyFileSync(source, destination);
            if (platform !== "win32") chmodSync(destination, sourceStat.mode & 0o777);
          }
          appendFileSync(process.env.GITHUB_ENV, `COLONY_ELECTRON_RUNTIME=${runtimeDir}${os.EOL}`);
          NODE

      # The app carries its own LGPL-only ffmpeg so voice notes, video and HEIC
      # photos work on a machine without Homebrew. Built from the pinned source
      # in desktop/ffmpeg-bundle and cached; the packager fails without it.
      - name: Build bundled ffmpeg
        id: ffmpeg
        uses: ./.github/actions/build-ffmpeg-bundle
        with:
          platform-key: ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Prepare temporary Apple signing keychain
        if: env.COLONY_RELEASE_BUILD == 'true' && matrix.platform == 'darwin' && needs.resolve-signing.outputs.mac_signed == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_B64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_B64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/colony-release.keychain-db"
          cert_path="$RUNNER_TEMP/colony-developer-id.p12"
          notary_key_path="$RUNNER_TEMP/colony-notary-key.p8"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12_B64" | base64 --decode > "$cert_path"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_B64" | base64 --decode > "$notary_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application:/{print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application identity was found in the temporary keychain." >&2
            exit 1
          fi
          {
            echo "COLONY_TEMP_KEYCHAIN_PATH=$keychain_path"
            echo "COLONY_TEMP_APPLE_CERT_PATH=$cert_path"
            echo "COLONY_TEMP_NOTARY_KEY_PATH=$notary_key_path"
            echo "COLONY_APPLE_DEVELOPER_IDENTITY=$identity"
            echo "COLONY_APPLE_NOTARY_KEY_PATH=$notary_key_path"
            echo "COLONY_APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "COLONY_APPLE_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Prepare optional Windows signing certificate
        if: env.COLONY_RELEASE_BUILD == 'true' && matrix.platform == 'win32' && needs.resolve-signing.outputs.windows_signed == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_B64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_B64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "colony-code-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_PFX_B64)
          )
          $securePassword = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERT_PASSWORD -AsPlainText -Force
          $certificate = Get-PfxCertificate -FilePath $certificatePath -Password $securePassword
          if (-not $certificate.Subject) { throw "Windows signing certificate has no subject." }
          Add-Content -Path $env:GITHUB_ENV -Value "COLONY_WINDOWS_CERT_PATH=$certificatePath"
          Add-Content -Path $env:GITHUB_ENV -Value "CSC_LINK=$certificatePath"
          Add-Content -Path $env:GITHUB_ENV -Value "COLONY_ELECTRON_PUBLISHER_NAME=$($certificate.Subject)"

      - name: Package Electron app
        shell: bash
        env:
          COLONY_FFMPEG_BUNDLE_DIR: ${{ steps.ffmpeg.outputs.directory }}
          COLONY_ELECTRON_RELEASE: ${{ env.COLONY_RELEASE_BUILD == 'true' && '1' || '0' }}
          COLONY_ELECTRON_PRODUCT_NAME: ${{ env.COLONY_RELEASE_BUILD == 'true' && 'Colony' || '' }}
          COLONY_ELECTRON_SIGNED: ${{ env.COLONY_RELEASE_BUILD == 'true' && ((matrix.platform == 'darwin' && needs.resolve-signing.outputs.mac_signed == 'true') || (matrix.platform == 'win32' && needs.resolve-signing.outputs.windows_signed == 'true')) && '1' || '0' }}
          COLONY_ELECTRON_AUTO_UPDATE: ${{ env.COLONY_RELEASE_BUILD == 'true' && (matrix.platform != 'darwin' || needs.resolve-signing.outputs.mac_signed == 'true') && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "win32" ]; then
            host="$COLONY_ELECTRON_RUNTIME/colony-native-host.exe"
          else
            host="$COLONY_ELECTRON_RUNTIME/colony-native-host"
          fi
          pnpm --dir desktop run electron:package \
            --platform=${{ matrix.platform }} \
            --arch=${{ matrix.arch }} \
            --host="$host"

      - name: Build release installer and updater metadata
        if: env.COLONY_RELEASE_BUILD == 'true'
        shell: bash
        env:
          COLONY_ELECTRON_SIGNED: ${{ ((matrix.platform == 'darwin' && needs.resolve-signing.outputs.mac_signed == 'true') || (matrix.platform == 'win32' && needs.resolve-signing.outputs.windows_signed == 'true')) && '1' || '0' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'win32' && needs.resolve-signing.outputs.windows_signed == 'true' && secrets.WINDOWS_SIGNING_CERT_PASSWORD || '' }}
        run: pnpm --dir desktop run electron:installer -- ${{ matrix.platform }} ${{ matrix.arch }}

      # Installed Macs update by unpacking this archive and swapping the app in
      # place, so it must unpack to a Colony app whose signature verifies.
      - name: Verify the Mac update archive unpacks to a valid app
        if: env.COLONY_RELEASE_BUILD == 'true' && matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          archive="$(ls desktop/dist-electron/release/Colony-*-arm64-*.zip)"
          check="$RUNNER_TEMP/colony-update-archive-check"
          rm -rf "${check:?}"
          mkdir -p "$check"
          ditto -x -k "$archive" "$check"
          app="$check/Colony.app"
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = "xyz.block.buzz.app.electron"
          rm -rf "${check:?}"

      - name: Remove temporary signing credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COLONY_TEMP_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$COLONY_TEMP_KEYCHAIN_PATH" || true
          fi
          for path in "${COLONY_TEMP_APPLE_CERT_PATH:-}" "${COLONY_TEMP_NOTARY_KEY_PATH:-}"; do
            if [ -n "$path" ]; then rm -f "$path"; fi
          done

      - name: Remove temporary Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:COLONY_WINDOWS_CERT_PATH) {
            Remove-Item -LiteralPath $env:COLONY_WINDOWS_CERT_PATH -Force -ErrorAction SilentlyContinue
          }

      - name: Upload package artifact
        if: ${{ env.COLONY_RELEASE_BUILD != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colony-electron-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist-electron/${{ matrix.platform }}-${{ matrix.arch }}
            desktop/dist-electron/${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release installer artifacts
        if: env.COLONY_RELEASE_BUILD == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colony-electron-release-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/dist-electron/release/*
          if-no-files-found: error
          retention-days: 7

      - name: Smoke launch packaged app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          NODE_OPTIONS: ""
          COLONY_NATIVE_HOST: ""
          COLONY_ELECTRON_SMOKE: "1"
          COLONY_ELECTRON_BACKGROUND: "1"
          # Every build is named Colony (the Tauri config default); the release flag only pins it.
          COLONY_ELECTRON_PRODUCT_NAME: ${{ env.COLONY_RELEASE_BUILD == 'true' && 'Colony' || '' }}
          COLONY_ELECTRON_USER_DATA: ${{ runner.temp }}/colony-electron-smoke-user-data
        run: |
          set -euo pipefail
          package_name="${COLONY_ELECTRON_PRODUCT_NAME:-Colony}"
          command=("$GITHUB_WORKSPACE/desktop/dist-electron/darwin-arm64/$package_name.app/Contents/MacOS/$package_name")
          python3 - "${command[@]}" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          child = subprocess.Popen(sys.argv[1:], env=os.environ.copy(), start_new_session=True)
          try:
              status = child.wait(timeout=90)
          except subprocess.TimeoutExpired:
              os.killpg(child.pid, signal.SIGTERM)
              try:
                  child.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  os.killpg(child.pid, signal.SIGKILL)
                  child.wait()
              raise SystemExit("Packaged Electron smoke did not exit within 90 seconds.")
          if status != 0:
              raise SystemExit(f"Packaged Electron smoke exited with status {status}.")
          PY

      - name: Smoke launch packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NODE_OPTIONS: ""
          COLONY_NATIVE_HOST: ""
          COLONY_ELECTRON_SMOKE: "1"
          COLONY_ELECTRON_BACKGROUND: "1"
          COLONY_ELECTRON_PRODUCT_NAME: ${{ env.COLONY_RELEASE_BUILD == 'true' && 'Colony' || '' }}
        run: |
          $env:COLONY_ELECTRON_USER_DATA = Join-Path $env:RUNNER_TEMP "colony-electron-smoke-user-data"
          $packageName = if ($env:COLONY_ELECTRON_PRODUCT_NAME) { $env:COLONY_ELECTRON_PRODUCT_NAME } else { "Colony" }
          $appPath = Join-Path $env:GITHUB_WORKSPACE "desktop/dist-electron/win32-x64/$packageName.exe"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "electron-smoke.stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "electron-smoke.stderr.log"
          $process = Start-Process -FilePath $appPath -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          if (-not $process.WaitForExit(90000)) {
            $process.Kill($true)
            throw "Packaged Electron smoke did not exit within 90 seconds."
          }
          if (Test-Path $stdoutPath) { Get-Content $stdoutPath }
          if (Test-Path $stderrPath) { Get-Content $stderrPath }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Electron smoke exited with status $($process.ExitCode)."
          }
