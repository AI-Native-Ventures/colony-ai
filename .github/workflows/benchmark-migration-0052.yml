name: Benchmark migration 0052

# Manual only: migration 0052 benchmark.
# Run it from Actions > Run workflow. Moved out of automatic CI by the
# CI strip; the full list is in the CI strip pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5.0.0
        with:
          persist-credentials: false

      - name: Run synthetic migration benchmark
        env:
          MIGRATION_BENCH_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: python3 scripts/bench-migration-0052.py
