name: Colony Electron identity bridge proof

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/electron-stage0-manifest.json"
      - "desktop/package.json"
      - "desktop/src-electron/**"
      - "desktop/src-native-host/**"
      - "desktop/scripts/check-electron-stage0.mjs"
      - "desktop/scripts/check-electron-stage0.test.mjs"
      - "desktop/scripts/package-electron-stage0.mjs"
      - "desktop/scripts/stage-electron-stage0.mjs"
      - "desktop/playwright.electron.config.ts"
      - "desktop/tests/electron-identity-bridge.spec.ts"
      - "desktop/tests/electron-stage0-package.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/colony-identity-electron.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-identity-bridge:
    name: packaged Electron identity bridge / macOS arm64
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4

      - name: Assert native macOS arm64 runner
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          echo "runner_architecture=$machine"
          case "$machine" in
            arm64|aarch64) ;;
            *) echo "identity bridge requires a native arm64 runner" >&2; exit 1 ;;
          esac

      - name: Activate the pinned toolchain and install desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          node --version
          pnpm --version
          pnpm install --frozen-lockfile --filter buzz
          pnpm --dir desktop exec install-electron

      - name: Build the production identity helper
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          cargo build --locked --release \
            --manifest-path desktop/src-native-host/Cargo.toml \
            --target aarch64-apple-darwin \
            --no-default-features --features identity-system-keyring

      - name: Stage and package both immutable flavors
        shell: bash
        env:
          COLONY_NATIVE_HOST_BIN: ${{ github.workspace }}/desktop/src-native-host/target/aarch64-apple-darwin/release/colony-native-host
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          pnpm --dir desktop electron:stage0:package
          pnpm --dir desktop electron:stage0:package:instrumented

      - name: Inspect the real ASAR and helper boundary
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          node desktop/scripts/check-electron-stage0.mjs \
            desktop/dist-electron-normal --flavor=normal
          node desktop/scripts/check-electron-stage0.mjs \
            desktop/dist-electron-instrumented --flavor=instrumented
          normal_app="$(find desktop/dist-electron-normal -path '*/Contents/MacOS/Buzz Stage0 Normal' -type f -print -quit)"
          test -n "$normal_app"
          file "$normal_app" | grep -Eq 'arm64|aarch64'

      - name: Prepare an owned disposable macOS identity namespace
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/colony-electron-identity-home"
          keychain="$RUNNER_TEMP/colony-electron-identity.keychain-db"
          mkdir -p "$proof_home/Library/Application Support/Colony/dev"
          test ! -e "$proof_home/Library/Application Support/Colony/dev/0000000000000001"
          HOME="$proof_home" security create-keychain -p "" "$keychain" >/dev/null
          HOME="$proof_home" security set-keychain-settings -lut 7200 "$keychain"
          HOME="$proof_home" security unlock-keychain -p "" "$keychain"
          HOME="$proof_home" security list-keychains -d user -s "$keychain"
          HOME="$proof_home" security default-keychain -d user -s "$keychain"
          echo "HOME=$proof_home" >> "$GITHUB_ENV"
          echo "COLONY_IDENTITY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Run focused bridge and transport tests
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          node --test \
            desktop/src-electron/identity-protocol.test.mjs \
            desktop/src-electron/identity-launch.test.mjs \
            desktop/src-electron/native-host-identity.test.mjs

      - name: Run the packaged normal identity bridge proof
        shell: bash
        env:
          COLONY_STAGE0_PLAYWRIGHT_OUTPUT: identity-test-results
          COLONY_STAGE0_PLAYWRIGHT_REPORT: identity-playwright-electron-report
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          pnpm --dir desktop exec playwright test \
            --config playwright.electron.config.ts \
            tests/electron-identity-bridge.spec.ts

      - name: Record immutable flavor and artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          for flavor in normal instrumented; do
            package_dir="desktop/.stage0-package-$flavor"
            node -e 'const fs=require("node:fs");const p=process.argv[1];const j=JSON.parse(fs.readFileSync(p+"/package.json"));console.log(JSON.stringify({flavor:j.stage0Flavor,applicationId:j.stage0ApplicationId,userDataSuffix:j.stage0UserDataSuffix,sourceRevision:j.stage0SourceRevision,instrumentation:j.stage0Instrumentation}))' "$package_dir"
          done
          find desktop/dist-electron-normal -type f -maxdepth 8 -print0 | sort -z | xargs -0 shasum -a 256

      - name: Upload unsigned identity bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-identity-bridge-macos-arm64-${{ github.sha }}
          path: |
            desktop/dist-electron-normal
            desktop/dist-electron-instrumented
            desktop/identity-playwright-electron-report
            desktop/identity-test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the owned disposable namespace and keychain
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          proof_home="${HOME:-}"
          keychain="${COLONY_IDENTITY_KEYCHAIN:-}"
          if [ -n "$proof_home" ]; then
            HOME="$proof_home" security default-keychain -d user -s login.keychain-db >/dev/null 2>&1 || true
            HOME="$proof_home" security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
          fi
          if [ -n "$keychain" ]; then
            HOME="$proof_home" security delete-keychain "$keychain" >/dev/null 2>&1 || true
          fi
          if [ -n "$proof_home" ]; then
            rm -rf "$proof_home/Library/Application Support/Colony/dev/0000000000000001"
          fi
