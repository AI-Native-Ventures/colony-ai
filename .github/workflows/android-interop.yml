name: Android relay interop

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
    paths:
      - ".github/workflows/android-interop.yml"
      - "scripts/interop/android-interop-*"
      - "scripts/start-relay-for-tests.sh"
      - "scripts/reconcile-schema-after-pgschema.sql"
      - "schema/schema.sql"
      - "justfile"
      - "docker-compose.yml"
      - "crates/buzz-core/**"
      - "crates/buzz-db/**"
      - "crates/buzz-auth/**"
      - "crates/buzz-relay/**"
      - "mobile/android/**"
      - "mobile/assets/**"
      - "mobile/lib/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - "mobile/test/shared/relay/relay_live_interop_test.dart"
      - "desktop/src/features/messages/**"
  pull_request:
    branches:
      - feat/phase1-drive
    paths:
      - ".github/workflows/android-interop.yml"
      - "scripts/interop/android-interop-*"
      - "scripts/start-relay-for-tests.sh"
      - "scripts/reconcile-schema-after-pgschema.sql"
      - "schema/schema.sql"
      - "justfile"
      - "docker-compose.yml"
      - "crates/buzz-core/**"
      - "crates/buzz-db/**"
      - "crates/buzz-auth/**"
      - "crates/buzz-relay/**"
      - "mobile/android/**"
      - "mobile/assets/**"
      - "mobile/lib/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - "mobile/test/shared/relay/relay_live_interop_test.dart"
      - "desktop/src/features/messages/**"

permissions:
  contents: read

concurrency:
  group: android-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PACKAGE: ventures.ainative.colony.dogfood
  ANDROID_ACTIVITY: ventures.ainative.colony.dogfood/xyz.block.buzz.mobile.MainActivity
  APK_PATH: mobile/build/app/outputs/flutter-apk/app-debug.apk
  ANDROID_INTEROP_ARTIFACT_DIR: android-interop-artifacts
  SOURCE_SHA: ${{ github.sha }}
  INTEROP_RELAY_HTTP: http://localhost:3000
  CARGO_BUILD_JOBS: 4

jobs:
  android-interop:
    name: Android emulator with live relay
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Activate the pinned toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Compute Hermit cache key
        id: hermit-bin-hash
        shell: bash
        run: |
          hash="$(find ./bin ! -type d | sort | xargs openssl sha256 | openssl sha256 -r | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore Hermit package cache
        id: hermit-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/hermit/pkg
          key: ${{ runner.os }}-hermit-cache-${{ steps.hermit-bin-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-hermit-cache-

      - name: Prime Flutter and Rust toolchains
        run: |
          flutter --version
          cargo --version

      - name: Save Hermit package cache
        if: always() && steps.hermit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ~/.cache/hermit/pkg
          key: ${{ runner.os }}-hermit-cache-${{ steps.hermit-bin-hash.outputs.hash }}

      - name: Set up Node for the nostr-tools peer
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install the pinned Nostr peer dependency
        shell: bash
        run: |
          set -euo pipefail
          peer_dir="$RUNNER_TEMP/android-interop-peer"
          mkdir -p "$peer_dir"
          npm install --prefix "$peer_dir" --no-save --package-lock=false \
            --ignore-scripts --no-audit --no-fund nostr-tools@2.23.12
          cp scripts/interop/android-interop-peer.mjs "$peer_dir/android-interop-peer.mjs"
          echo "ANDROID_INTEROP_PEER_DIR=$peer_dir" >> "$GITHUB_ENV"
          node "$peer_dir/android-interop-peer.mjs" verify
          node "$peer_dir/android-interop-peer.mjs" provision \
            --key "$RUNNER_TEMP/android-interop-peer/peer-key.json" \
            --invite "$RUNNER_TEMP/android-interop-peer/invite.json"

      - name: Restore Flutter package cache
        id: pub-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-android-interop-pub-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-android-interop-pub-

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Save Flutter package cache
        if: always() && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        continue-on-error: true
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-android-interop-pub-${{ hashFiles('mobile/pubspec.lock') }}

      - name: Build the debug Android app
        env:
          COLONY_GOOGLE_SERVER_CLIENT_ID: ${{ vars.COLONY_GOOGLE_WEB_CLIENT_ID }}
        run: |
          just mobile-build-android
          test -s "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Start and seed the disposable relay
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/start-relay-for-tests.sh
          bash scripts/interop/android-interop-relay.sh seed-owner
          node "$ANDROID_INTEROP_PEER_DIR/android-interop-peer.mjs" mint-invite \
            --output "$ANDROID_INTEROP_INVITE_PATH"

      - name: Initialize Android interop evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_INTEROP_ARTIFACT_DIR"
          cat > "$ANDROID_INTEROP_ARTIFACT_DIR/RUN.txt" <<'EOF'
          Android interop evidence directory initialized before emulator setup.
          Screenshots and protocol evidence are added when the proof harness starts.
          EOF

      - name: Require the normal Linux emulator acceleration path
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Install Android emulator runtime dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes libpulse0

      - name: Prepare Android emulator package with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "Android SDK root is not configured" >&2
            exit 1
          fi
          sdkmanager_dir="$sdk_root/cmdline-tools/latest/bin"
          if [[ ! -x "$sdkmanager_dir/sdkmanager" ]]; then
            echo "Android SDK manager was not found at $sdkmanager_dir" >&2
            exit 1
          fi
          export PATH="$sdkmanager_dir:$sdk_root/platform-tools:$PATH"

          for attempt in 1 2 3; do
            echo "Installing Android Emulator package (attempt $attempt/3)"
            if sdkmanager --install emulator --channel=0 &&
              [[ -x "$sdk_root/emulator/emulator" ]] &&
              "$sdk_root/emulator/emulator" -version; then
              exit 0
            fi

            echo "Emulator package is missing or invalid after attempt $attempt" >&2
            rm -rf "$sdk_root/emulator"
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done

          echo "Android Emulator could not be installed after three attempts" >&2
          exit 1

      - name: Sign in and prove Android live relay interoperability
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          disable-animations: true
          script: bash scripts/interop/android-interop-proof.sh

      - name: Stop disposable relay services
        if: always()
        shell: bash
        run: |
          if [[ -s /tmp/buzz-relay.pid ]]; then
            kill -TERM "$(cat /tmp/buzz-relay.pid)" 2>/dev/null || true
          fi
          docker compose down -v || true

      - name: Upload Android interop screenshots and protocol evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-interop-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: android-interop-artifacts
