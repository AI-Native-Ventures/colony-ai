name: Colony terminal contract

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/src-native-host-terminal/**"
      - ".github/workflows/colony-terminal-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: macOS arm64 terminal contract
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4

      - name: Assert hosted runner architecture
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          echo "runner_architecture=$machine"
          case "$machine" in
            arm64|aarch64) ;;
            *)
              echo "This lane requires a native macOS arm64 runner; got $machine" >&2
              exit 1
              ;;
          esac

      - name: Activate the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          rustc -vV

      - name: Check isolated terminal formatting
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          cargo fmt --manifest-path desktop/src-native-host-terminal/Cargo.toml -- --check

      - name: Prove the terminal package has no Tauri or renderer imports
        shell: bash
        run: |
          set -euo pipefail
          # Path-scoped scan: real `use` imports and `::` paths only,
          # so upstream-reference prose in doc comments cannot trip it.
          if grep -r -E -i "^[[:space:]]*use[[:space:]]+tauri(::|[[:space:];])" \
            desktop/src-native-host-terminal/src desktop/src-native-host-terminal/tests; then
            echo "forbidden tauri import in the isolated terminal package" >&2
            exit 1
          fi
          if grep -r -E "tauri::" \
            desktop/src-native-host-terminal/src desktop/src-native-host-terminal/tests; then
            echo "forbidden tauri path in the isolated terminal package" >&2
            exit 1
          fi
          echo "terminal import scan passed"

      - name: Run the terminal contract tests
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          cargo test --manifest-path desktop/src-native-host-terminal/Cargo.toml
