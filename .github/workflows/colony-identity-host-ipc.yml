name: Colony identity host IPC

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/src-native-host/**"
      - "desktop/identity-kernel/**"
      - "desktop/identity-store/**"
      - ".github/workflows/colony-identity-host-ipc.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  identity-host:
    name: Identity host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Activate the pinned toolchain
        if: runner.os != 'Windows'
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Check native-host formatting
        shell: bash
        run: cargo fmt --manifest-path desktop/src-native-host/Cargo.toml -- --check

      - name: Compile the default health-only graph
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path desktop/src-native-host/Cargo.toml \
            --no-default-features

      - name: Run v1 regression and opt-in v2 file-only stdio proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path desktop/src-native-host/Cargo.toml \
            --no-default-features --features identity-file-only

      - name: Compile the system-keyring graph without activating a keyring
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path desktop/src-native-host/Cargo.toml \
            --no-default-features --features identity-system-keyring

      - name: Build the production system-keyring carrier
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --manifest-path desktop/src-native-host/Cargo.toml \
            --no-default-features --features identity-system-keyring

      - name: Exercise production pre-initialization rejection with the built carrier
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/desktop/src-native-host/target/release/colony-native-host"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            binary="${binary}.exe"
          fi
          COLONY_NATIVE_HOST_BIN="$binary" cargo test --locked \
            --manifest-path desktop/src-native-host/Cargo.toml \
            --no-default-features --features identity-system-keyring \
            --test identity_production_dispatch -- --nocapture
