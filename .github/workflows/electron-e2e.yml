name: Electron relay end-to-end

on:
  pull_request:
    branches:
      - feat/phase1-drive
    paths:
      - ".github/workflows/electron-e2e.yml"
      - "Cargo.lock"
      - "Justfile"
      - "desktop/electron/**"
      - "desktop/package.json"
      - "desktop/playwright.electron-app.config.ts"
      - "desktop/src/shared/api/electronTauriShim.ts"
      - "desktop/src/**"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/src-tauri/src/**"
      - "desktop/identity-kernel/**"
      - "desktop/identity-store/**"
      - "desktop/tests/electron/**"
      - "pnpm-lock.yaml"
      - "crates/buzz-auth/**"
      - "crates/buzz-core/**"
      - "crates/buzz-db/**"
      - "crates/buzz-relay/**"
      - "scripts/start-relay-for-tests.sh"
      - "scripts/setup-desktop-test-data.sh"
      - "schema/schema.sql"
      - "scripts/reconcile-schema-after-pgschema.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  electron-relay-e2e:
    name: Electron relay E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4

      - name: Activate the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          rustc -vV
          node --version
          pnpm --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install desktop JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          pnpm install --frozen-lockfile --filter buzz

      - name: Generate isolated Nostr identities for the relay fixtures
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          fixture_file="$RUNNER_TEMP/colony-electron-identities.json"
          pnpm --dir desktop exec node tests/electron/prepare-fixtures.mjs "$fixture_file"
          echo "COLONY_ELECTRON_FIXTURE_FILE=$fixture_file" >> "$GITHUB_ENV"

      - name: Build the Electron native host
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          just _ensure-sidecar-stubs
          cargo build --locked --features electron-host --bin colony-native-host \
            --manifest-path desktop/src-tauri/Cargo.toml
          target_directory="$(cargo metadata --manifest-path desktop/src-tauri/Cargo.toml \
            --no-deps --format-version=1 | node -e 'let input="";process.stdin.on("data",chunk=>input+=chunk).on("end",()=>process.stdout.write(JSON.parse(input).target_directory))')"
          source_host="$target_directory/debug/colony-native-host"
          test -x "$source_host"
          private_host="$RUNNER_TEMP/colony-native-host"
          cp "$source_host" "$private_host"
          chmod 700 "$private_host"
          echo "COLONY_NATIVE_HOST=$private_host" >> "$GITHUB_ENV"

      - name: Build the React renderer for colony://app
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          pnpm --dir desktop exec vite build

      - name: Install native PostgreSQL and Redis for the relay
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install postgresql@17 redis
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix redis)/bin" >> "$GITHUB_PATH"

      - name: Prepare the disposable database and pre-seed fixture members
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          export PATH="$(brew --prefix postgresql@17)/bin:$(brew --prefix redis)/bin:$PATH"
          database_root="$RUNNER_TEMP/colony-postgres"
          initdb -D "$database_root" --username="$(whoami)" \
            --auth-local=trust --auth-host=trust
          pg_ctl -D "$database_root" -l "$RUNNER_TEMP/postgres.log" \
            -o "-h 127.0.0.1 -p 5432" -w start
          psql -h 127.0.0.1 -p 5432 -U "$(whoami)" -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE buzz WITH LOGIN SUPERUSER PASSWORD 'buzz_dev'"
          createdb -h 127.0.0.1 -p 5432 -U "$(whoami)" -O buzz buzz
          redis-server --bind 127.0.0.1 --port 6379 --daemonize yes \
            --pidfile "$RUNNER_TEMP/redis.pid" --logfile "$RUNNER_TEMP/redis.log"
          for attempt in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U buzz >/dev/null 2>&1 \
              && redis-cli -h 127.0.0.1 -p 6379 ping | rg -q PONG; then
              break
            fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U buzz
          redis-cli -h 127.0.0.1 -p 6379 ping
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=buzz PGPASSWORD=buzz_dev PGDATABASE=buzz
          export PGSCHEMA_PLAN_HOST=127.0.0.1 PGSCHEMA_PLAN_PORT=5432
          export PGSCHEMA_PLAN_DB=buzz PGSCHEMA_PLAN_USER=buzz PGSCHEMA_PLAN_PASSWORD=buzz_dev
          ./bin/pgschema apply --file schema/schema.sql --auto-approve
          psql -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
            < scripts/reconcile-schema-after-pgschema.sql
          bash scripts/setup-desktop-test-data.sh
          BUZZ_COMMUNITY_HOST=localhost:3001 bash scripts/setup-desktop-test-data.sh
          COLONY_ELECTRON_FIXTURE_FILE="$COLONY_ELECTRON_FIXTURE_FILE" \
            pnpm --dir desktop exec node tests/electron/seed-fixtures.mjs

      - name: Build and start the disposable relay
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          cargo build --locked --profile ci -p buzz-relay -p git-credential-nostr
          relay_key="$(openssl rand -hex 32)"
          nohup env \
            DATABASE_URL=postgres://buzz:buzz_dev@127.0.0.1:5432/buzz \
            REDIS_URL=redis://127.0.0.1:6379 \
            RELAY_URL=ws://localhost:3000 \
            BUZZ_BIND_ADDR=0.0.0.0:3000 \
            BUZZ_RELAY_PRIVATE_KEY="$relay_key" \
            BUZZ_REQUIRE_AUTH_TOKEN=false \
            BUZZ_RECONCILE_CHANNELS=true \
            BUZZ_GIT_PROBE_WRITERS=8 \
            ./target/ci/buzz-relay > /tmp/buzz-relay.log 2>&1 &
          echo "$!" > /tmp/buzz-relay.pid
          for attempt in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/buzz-relay.pid)" 2>/dev/null; then
              cat /tmp/buzz-relay.log
              echo "Relay process exited before becoming ready" >&2
              exit 1
            fi
            status="$(curl -s -o /dev/null -w "%{http_code}" \
              http://127.0.0.1:3000/_readiness || true)"
            if [[ "$status" == 200 ]]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/buzz-relay.log
          echo "Relay did not become ready within 60 seconds" >&2
          exit 1

      - name: Prepare an isolated macOS keychain for generated test identities
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          proof_home="$RUNNER_TEMP/colony-electron-e2e-home"
          keychain="$RUNNER_TEMP/colony-electron-e2e.keychain-db"
          mkdir -p "$proof_home/Library/Preferences" \
            "$proof_home/Library/Application Support/Colony/dev"
          HOME="$proof_home" security create-keychain -p "" "$keychain" >/dev/null
          HOME="$proof_home" security set-keychain-settings -lut 7200 "$keychain"
          HOME="$proof_home" security unlock-keychain -p "" "$keychain"
          HOME="$proof_home" security list-keychains -d user -s "$keychain"
          HOME="$proof_home" security default-keychain -d user -s "$keychain"
          echo "HOME=$proof_home" >> "$GITHUB_ENV"

      - name: Run the real Electron messaging and reconnect suite
        shell: bash
        env:
          BUZZ_RELAY_URL: ws://localhost:3000
          COLONY_ELECTRON_FIXTURE_FILE: ${{ runner.temp }}/colony-electron-identities.json
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          pnpm --dir desktop test:electron

      - name: Copy relay log into the artifact directory
        if: always()
        run: |
          mkdir -p desktop/test-results-electron
          if [[ -f /tmp/buzz-relay.log ]]; then
            cp /tmp/buzz-relay.log desktop/test-results-electron/buzz-relay.log
          fi
          if [[ -f "$RUNNER_TEMP/postgres.log" ]]; then
            cp "$RUNNER_TEMP/postgres.log" desktop/test-results-electron/postgres.log
          fi
          if [[ -f "$RUNNER_TEMP/redis.log" ]]; then
            cp "$RUNNER_TEMP/redis.log" desktop/test-results-electron/redis.log
          fi

      - name: Upload traces, screenshots, videos, and runtime logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-relay-e2e-${{ matrix.os }}
          path: |
            desktop/test-results-electron
            desktop/playwright-electron-app-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the disposable macOS identity keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/colony-electron-e2e.keychain-db"
          if [[ -f "$keychain" ]]; then
            HOME="$HOME" security delete-keychain "$keychain" >/dev/null 2>&1 || true
          fi
          rm -rf "$RUNNER_TEMP/colony-electron-e2e-home"

      - name: Stop disposable relay services
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/buzz-relay.pid ]]; then
            kill "$(cat /tmp/buzz-relay.pid)" 2>/dev/null || true
          fi
          if [[ -d "$RUNNER_TEMP/colony-postgres" ]]; then
            "$(brew --prefix postgresql@17)/bin/pg_ctl" \
              -D "$RUNNER_TEMP/colony-postgres" -m fast stop || true
          fi
          if [[ -f "$RUNNER_TEMP/redis.pid" ]]; then
            "$(brew --prefix redis)/bin/redis-cli" \
              -h 127.0.0.1 -p 6379 shutdown || true
          fi
