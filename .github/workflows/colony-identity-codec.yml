name: Colony identity codec real-helper interop

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/src-electron/identity-protocol.mjs"
      - "desktop/src-electron/identity-protocol.test.mjs"
      - "desktop/src-electron/identity-protocol.interop.test.mjs"
      - "desktop/src-native-host/**"
      - "desktop/identity-kernel/**"
      - "desktop/identity-store/**"
      - "desktop/electron-stage0-manifest.json"
      - ".github/workflows/colony-identity-codec.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  interop:
    name: Real Rust codec interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Activate the pinned toolchain
        if: runner.os != 'Windows'
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Check the codec and native-host formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path desktop/src-native-host/Cargo.toml -- --check
          node --check desktop/src-electron/identity-protocol.mjs
          node --check desktop/src-electron/identity-protocol.interop.test.mjs

      - name: Run the focused pure codec tests
        shell: bash
        run: node --test desktop/src-electron/identity-protocol.test.mjs

      - name: Build the real identity-file-only helper
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --manifest-path desktop/src-native-host/Cargo.toml \
            --no-default-features --features identity-file-only

      - name: Run Node against the real Rust helper
        shell: bash
        env:
          COLONY_IDENTITY_CODEC_INTEROP_REQUIRED: "1"
        run: node --test desktop/src-electron/identity-protocol.interop.test.mjs
