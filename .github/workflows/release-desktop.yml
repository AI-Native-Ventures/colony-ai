name: Release Colony Desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing desktop-v tag version to release
        required: true
        type: string

concurrency:
  group: colony-desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-info:
    name: Validate release tag and version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate tag and app versions
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./desktop/package.json").version')"
          tauri_version="$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${EVENT_REF#refs/tags/desktop-v}"
          fi
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version must be a normalized stable semantic version." >&2
            exit 1
          fi
          expected_ref="refs/tags/desktop-v$version"
          if [ "$EVENT_REF" != "$expected_ref" ]; then
            echo "Select the existing desktop-v$version tag when using workflow_dispatch." >&2
            exit 1
          fi
          if [ "$package_version" != "$version" ] || [ "$tauri_version" != "$version" ]; then
            echo "The tag, desktop/package.json, and desktop/src-tauri/tauri.conf.json versions must match." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=desktop-v$version"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Build signed or unsigned installers
    needs: release-info
    uses: ./.github/workflows/electron-package.yml
    with:
      release: true
    secrets:
      COLONY_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.COLONY_GOOGLE_DESKTOP_CLIENT_SECRET }}
      APPLE_DEVELOPER_ID_CERT_P12_B64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_B64 }}
      APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
      APPLE_NOTARY_API_KEY_P8_B64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_B64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      WINDOWS_SIGNING_CERT_PFX_B64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_B64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}

  publish:
    name: Publish GitHub Release
    needs:
      - release-info
      - package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node and pnpm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Install metadata generator dependency
        run: pnpm install --frozen-lockfile --filter buzz

      - name: Download installers and updater feeds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: colony-electron-release-*
          path: release-assets
          merge-multiple: true

      - name: Generate update metadata and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
          MAC_SIGNED: ${{ needs.package.outputs.mac_signed }}
          WINDOWS_SIGNED: ${{ needs.package.outputs.windows_signed }}
        run: |
          set -euo pipefail
          node desktop/scripts/release-metadata.mjs \
            --assets-dir=release-assets \
            --version="$RELEASE_VERSION" \
            --mac-signed="$MAC_SIGNED" \
            --windows-signed="$WINDOWS_SIGNED"

      - name: Create release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
          MAC_SIGNED: ${{ needs.package.outputs.mac_signed }}
          WINDOWS_SIGNED: ${{ needs.package.outputs.windows_signed }}
        run: |
          set -euo pipefail
          if [ "$MAC_SIGNED" = "true" ]; then mac_status="signed and notarized"; else mac_status="UNSIGNED"; fi
          if [ "$WINDOWS_SIGNED" = "true" ]; then windows_status="signed"; else windows_status="UNSIGNED"; fi
          first_launch=""
          if [ "$MAC_SIGNED" != "true" ]; then first_launch="$first_launch- macOS: the app is not notarized, so macOS blocks the first launch. Open System Settings, then Privacy and Security, and choose Open Anyway for Colony.
          "; fi
          if [ "$WINDOWS_SIGNED" != "true" ]; then first_launch="$first_launch- Windows: if you see Windows protected your PC, choose More info, then Run anyway.
          "; fi
          cat > release-notes.md <<EOF
          Colony desktop $RELEASE_VERSION

          Signing status:
          - macOS: $mac_status
          - Windows: $windows_status
          - Linux: UNSIGNED

          Verify downloaded files with checksums.txt. Automatic updates require a signed macOS build. Windows and Linux updates verify the published updater checksum before installation.
          EOF
          if [ -n "$first_launch" ]; then
            {
              echo
              echo "First launch of unsigned builds:"
              printf '%s' "$first_launch" | sed 's/^ *//'
              echo "- Linux: make the AppImage executable (chmod +x), then run it."
            } >> release-notes.md
          fi

      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-info.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-info.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Colony $RELEASE_VERSION" \
              --notes-file release-notes.md \
              --draft=false \
              --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Colony $RELEASE_VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
