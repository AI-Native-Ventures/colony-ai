name: Hang probe 4 (throwaway)
on:
  pull_request:
    paths:
      - ".github/workflows/hang-probe4.yml"
      - "scripts/hang-probe4.sh"
permissions:
  contents: read
jobs:
  probe4:
    name: probe4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Probe 4
        run: scripts/hang-probe4.sh
