name: Colony RelayV2 transport adapter proof

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/src-electron/relay-transport.mjs"
      - "desktop/src-electron/relay-transport.test.mjs"
      - "desktop/src-electron/relay-transport.interop.mjs"
      - "desktop/src-electron/relay-protocol.mjs"
      - "desktop/src-native-host/**"
      - ".github/workflows/colony-relay-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  adapter-proof:
    name: RelayV2 transport adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]

    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1

      - name: Activate the pinned toolchain
        if: runner.os != 'Windows'
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Check the adapter syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop/src-electron/relay-transport.mjs
          node --check desktop/src-electron/relay-transport.test.mjs
          node --check desktop/src-electron/relay-transport.interop.mjs

      - name: Run the focused mock transport vectors
        shell: bash
        run: node --test desktop/src-electron/relay-transport.test.mjs

      - name: Build the real helper for interop
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release \
            --manifest-path desktop/src-native-host/Cargo.toml
          test -x desktop/src-native-host/target/release/colony-native-host \
            || test -x desktop/src-native-host/target/release/colony-native-host.exe

      - name: Pin the helper build provenance
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          cargo --version
          rustc --version
          ls -la desktop/src-native-host/target/release/colony-native-host* || true

      - name: Run the adapter against the real helper
        shell: bash
        env:
          COLONY_RELAY_TRANSPORT_INTEROP_REQUIRED: "1"
        run: node --test desktop/src-electron/relay-transport.interop.mjs
