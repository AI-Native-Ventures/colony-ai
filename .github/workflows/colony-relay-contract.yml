name: Colony RelayV2 native contract

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/src-native-host/relay_v2_registry.json"
      - "desktop/src-native-host/src/relay_v2.rs"
      - "desktop/src-native-host/src/main.rs"
      - "desktop/src-native-host/Cargo.toml"
      - "desktop/src-native-host/Cargo.lock"
      - ".github/workflows/colony-relay-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  relay-contract:
    name: RelayV2 contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]

    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Activate the pinned toolchain
        if: runner.os != 'Windows'
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Check the native contract formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path desktop/src-native-host/Cargo.toml -- --check

      - name: Check the locked standalone metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --manifest-path desktop/src-native-host/Cargo.toml --no-deps --format-version 1 > /dev/null

      - name: Run the focused RelayV2 contract tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path desktop/src-native-host/Cargo.toml --bin colony-native-host relay_v2::tests:: -- --nocapture
