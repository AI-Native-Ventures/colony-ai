name: Colony shell clipboard adapter proof

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/src-electron/shell-clipboard.mjs"
      - "desktop/src-electron/shell-clipboard.test.mjs"
      - "desktop/src-electron/shell-clipboard.proof.mjs"
      - "desktop/playwright.electron.config.ts"
      - "desktop/tests/electron-shell-clipboard.spec.ts"
      - ".github/workflows/colony-shell-clipboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-proof:
    name: Shell clipboard adapter (mocked backend proof)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1

      - name: Syntax-check the adapter and its tests
        shell: bash
        run: |
          set -euo pipefail
          node --check desktop/src-electron/shell-clipboard.mjs
          node --check desktop/src-electron/shell-clipboard.test.mjs
          node --check desktop/src-electron/shell-clipboard.proof.mjs
          node --check desktop/src-electron/shell-clipboard.proof-main.mjs

      # Mocked proof only: the Electron `clipboard` backend is injected as a
      # fake under plain Node. Real Electron clipboard proof (running inside
      # the packaged shell) remains a separate integration gate and is NOT
      # claimed by this workflow.
      - name: Run the focused clipboard adapter tests
        shell: bash
        run: node --test desktop/src-electron/shell-clipboard.test.mjs

  real-backend-proof:
    name: Real Electron clipboard backend proof (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4

      - name: Assert native macOS arm64 runner
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          echo "runner_architecture=$machine"
          case "$machine" in
            arm64|aarch64) ;;
            *)
              echo "real clipboard proof requires a native arm64 runner" >&2
              exit 1
              ;;
          esac

      - name: Activate the pinned toolchain and install desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          node --version
          pnpm --version
          pnpm install --frozen-lockfile --filter buzz
          pnpm --dir desktop exec install-electron

      - name: Build the standalone arm64 helper
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          cargo build --locked --manifest-path desktop/src-native-host/Cargo.toml \
            --release --target aarch64-apple-darwin \
            --no-default-features --features identity-system-keyring

      - name: Stage the instrumented candidate (unchanged proof surface)
        shell: bash
        env:
          COLONY_NATIVE_HOST_BIN: ${{ github.workspace }}/desktop/src-native-host/target/aarch64-apple-darwin/release/colony-native-host
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          # The packaged app still launches for the normal/reload surface, but
          # the clipboard adapter proof runs in its own lane-owned Electron
          # main process (see the next step). Shared stage/pack scripts are
          # NOT modified. The stage-0 package guard keeps proving the frozen
          # file list because this lane adds no files to the package.
          rm -rf desktop/dist-electron-instrumented desktop/.stage0-package-instrumented
          pnpm --dir desktop electron:stage0:stage:instrumented
          COLONY_NATIVE_HOST_BIN="$COLONY_NATIVE_HOST_BIN" \
            pnpm --dir desktop electron:stage0:package:instrumented

      - name: Run the split real-backend + real-adapter proof
        shell: bash
        env:
          COLONY_STAGE0_PLAYWRIGHT_OUTPUT: clipboard-test-results
          COLONY_STAGE0_PLAYWRIGHT_REPORT: clipboard-playwright-electron-report
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          # The shared electron config's testMatch covers only the frozen
          # stage-0 gate specs; --config overrides testMatch via a lane-local
          # config file so shared config stays untouched. The spec launches
          # the PACKAGED app via electron.launch (firstWindow guarantees a
          # live main process, unlike raw spawnSync which hangs headless on
          # app.whenReady()), proves the live backend round-trip through the
          # documented evaluate callback, and proves the REAL adapter module
          # maps the contract onto the calls the live backend honored.
          cat > desktop/playwright.clipboard.config.ts <<'EOF'
          import base from "./playwright.electron.config";
          import { defineConfig } from "@playwright/test";

          export default defineConfig({
            ...base,
            testMatch: ["**/electron-shell-clipboard.spec.ts"],
          });
          EOF
          pnpm --dir desktop exec playwright test \
            --config playwright.clipboard.config.ts \
            tests/electron-shell-clipboard.spec.ts
          rm -f desktop/playwright.clipboard.config.ts

      - name: Upload unsigned clipboard proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-shell-clipboard-macos-arm64-${{ github.sha }}
          path: |
            desktop/clipboard-playwright-electron-report
            desktop/clipboard-test-results
          if-no-files-found: ignore
          retention-days: 7
