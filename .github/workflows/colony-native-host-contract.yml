name: Colony native host contract

on:
  pull_request:
    branches:
      - develop
    paths:
      - "desktop/electron-stage0-manifest.json"
      - "desktop/src-native-host/**"
      - "desktop/src-electron/**"
      - "desktop/scripts/check-native-host-scan.sh"
      - "desktop/scripts/check-native-host-scan.test.sh"
      - ".github/workflows/colony-native-host-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: macOS arm64 host protocol
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@v4

      - name: Assert hosted runner architecture
        shell: bash
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          echo "runner_architecture=$machine"
          case "$machine" in
            arm64|aarch64) ;;
            *)
              echo "This lane requires a native macOS arm64 runner; got $machine" >&2
              exit 1
              ;;
          esac

      - name: Activate the pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          rustc -vV

      - name: Check standalone host formatting
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          cargo fmt --manifest-path desktop/src-native-host/Cargo.toml -- --check

      - name: Test the standalone host scanner guard
        shell: bash
        run: |
          set -euo pipefail
          bash desktop/scripts/check-native-host-scan.test.sh

      - name: Prove the host has no Tauri dependency
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          dependency_tree="$(mktemp)"
          trap 'rm -f "$dependency_tree"' EXIT
          cargo tree --locked --manifest-path desktop/src-native-host/Cargo.toml > "$dependency_tree"
          bash desktop/scripts/check-native-host-scan.sh \
            --source-root desktop/src-native-host \
            --dependency-tree "$dependency_tree"

      - name: Run only the standalone stdio contract tests
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          cargo test --locked --manifest-path desktop/src-native-host/Cargo.toml

      - name: Build the standalone host for real Node interop
        shell: bash
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          cargo build --locked --manifest-path desktop/src-native-host/Cargo.toml --release

      - name: Run focused Node transport tests against the real Rust host
        shell: bash
        env:
          COLONY_NATIVE_HOST_BIN: ${{ github.workspace }}/desktop/src-native-host/target/release/colony-native-host
        run: |
          set -euo pipefail
          . ./bin/activate-hermit
          node --test desktop/src-electron/*.test.mjs
