name: Build ffmpeg bundle
description: >-
  Builds (or restores from cache) the LGPL-only ffmpeg that ships inside the
  Colony app, from the pinned source in desktop/ffmpeg-bundle, and checks it.

inputs:
  platform-key:
    description: darwin-arm64 (macOS runner) or win32-x64 (Windows runner).
    required: true

outputs:
  directory:
    description: Folder holding the ffmpeg binary and its licence text.
    value: ${{ steps.locate.outputs.directory }}

runs:
  using: composite
  steps:
    - name: Locate the bundle folder
      id: locate
      shell: bash
      run: echo "directory=${RUNNER_TEMP}/ffmpeg-bundle-${{ inputs.platform-key }}" >> "$GITHUB_OUTPUT"

    - name: Restore the ffmpeg build
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.locate.outputs.directory }}
        key: ffmpeg-bundle-${{ inputs.platform-key }}-${{ hashFiles('desktop/ffmpeg-bundle/manifest.json', 'desktop/ffmpeg-bundle/build.sh') }}

    - name: Build ffmpeg (macOS)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
      shell: bash
      env:
        FFMPEG_BUNDLE_DIR: ${{ steps.locate.outputs.directory }}
      run: desktop/ffmpeg-bundle/build.sh "${{ inputs.platform-key }}" "$FFMPEG_BUNDLE_DIR"

    - name: Set up MSYS2 (Windows)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: MINGW64
        path-type: inherit
        update: false
        install: >-
          make
          diffutils
          mingw-w64-x86_64-nasm
          tar
          xz
          curl
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-zlib

    - name: Build ffmpeg (Windows)
      if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: msys2 {0}
      env:
        FFMPEG_BUNDLE_DIR: ${{ steps.locate.outputs.directory }}
      run: |
        set -euo pipefail
        desktop/ffmpeg-bundle/build.sh "${{ inputs.platform-key }}" "$(cygpath -u "$FFMPEG_BUNDLE_DIR")"

    - name: Check the ffmpeg build
      shell: bash
      env:
        FFMPEG_BUNDLE_DIR: ${{ steps.locate.outputs.directory }}
      run: node desktop/ffmpeg-bundle/verify.mjs "${{ inputs.platform-key }}" "$FFMPEG_BUNDLE_DIR"

    - name: Save the ffmpeg build
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.locate.outputs.directory }}
        key: ffmpeg-bundle-${{ inputs.platform-key }}-${{ hashFiles('desktop/ffmpeg-bundle/manifest.json', 'desktop/ffmpeg-bundle/build.sh') }}
