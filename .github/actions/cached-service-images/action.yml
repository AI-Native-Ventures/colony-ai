name: Cached service images
description: >-
  Restore the digest-pinned MinIO and AWS CLI images used by docker compose
  from the Actions cache and point compose at them. Registries are only
  contacted on a cache miss, so anonymous pull limits (public.ecr.aws "Data
  limit exceeded", Docker Hub) no longer fail integration jobs.
runs:
  using: composite
  steps:
    - name: Resolve pinned image references
      id: refs
      shell: bash
      run: |
        set -euo pipefail
        minio="$(docker compose config --images minio)"
        init="$(docker compose config --images minio-init)"
        echo "minio=$minio" >> "$GITHUB_OUTPUT"
        echo "init=$init" >> "$GITHUB_OUTPUT"
        echo "key=buzz-service-images-v1-$(printf '%s\n%s' "$minio" "$init" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Restore service image cache
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: /tmp/buzz-service-images.tar
        key: ${{ steps.refs.outputs.key }}
    - name: Load cached service images
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker load --input /tmp/buzz-service-images.tar
    - name: Pull pinned service images
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        MINIO_REF: ${{ steps.refs.outputs.minio }}
        INIT_REF: ${{ steps.refs.outputs.init }}
      run: |
        set -euo pipefail
        pull() {
          for attempt in 1 2 3 4 5; do
            if docker pull --quiet "$1"; then return 0; fi
            echo "docker pull $1 failed (attempt $attempt)" >&2
            sleep $((attempt * 20))
          done
          return 1
        }
        pull "$MINIO_REF"
        pull "$INIT_REF"
        # docker load drops repository digests, so cache the pinned content
        # under local tags that compose can use without re-resolving the digest.
        docker tag "$MINIO_REF" buzz-ci/minio:pinned
        docker tag "$INIT_REF" buzz-ci/minio-init:pinned
        docker save --output /tmp/buzz-service-images.tar buzz-ci/minio:pinned buzz-ci/minio-init:pinned
    - name: Save service image cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: /tmp/buzz-service-images.tar
        key: ${{ steps.refs.outputs.key }}
    - name: Point docker compose at the cached images
      shell: bash
      run: |
        echo "BUZZ_MINIO_IMAGE=buzz-ci/minio:pinned" >> "$GITHUB_ENV"
        echo "BUZZ_MINIO_INIT_IMAGE=buzz-ci/minio-init:pinned" >> "$GITHUB_ENV"
